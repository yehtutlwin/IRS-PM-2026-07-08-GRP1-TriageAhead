# P10-P19 (18 Oct 2026, issue #29): five ESI v4 handbook practice cases and five Yale visits, selected so that the expected
# level comes from an outside source (the book's answer, or the triage nurse's recorded level) and the facts that decide it
# are ones a caregiver can report before arrival. Selection: experiments/persona_selection.md.
# Handbook personas state only the case's facts a caregiver can know: no vital signs, no examination findings.
# Yale personas state only what the visit's record holds (age, sex, the recorded complaint, medication classes, history
# flags) and answer "I don't know" to the rest; their danger-sign answers are "no" where the record lists no such complaint.
# Names and dates of birth are fictional; any other filled-in detail is named in the persona's comment.
- id: P10-infant-fever
  source: "ESI v4 handbook, chapter 9 practice case 14, p.72; book answer level 2, p.79"
  expect_floor: "at least ESI-2"        # the book's answer: level 2 (a febrile infant under 28 days); ESI v5 p.6 and p.23
  expect_rules: [B-56.infant-under-28-days-fever]
  voice: >
    You are the MOTHER of a two-week-old baby boy. He has a fever. You called your
    paediatrician and she told you to bring him to the emergency department because of
    the fever. You don't remember the number on the thermometer. He was born by a normal,
    uncomplicated delivery. He is acting like himself and feeding as usual. No medicines,
    no known allergies. You answer simply.
  truth:
    danger_signs.responsive: true
    complaint.category: fever
    complaint.fever: true
    patient.age: 0
    patient.age_days: 14
    patient.sex: male
    ams.changed_from_baseline: false
  say:
    danger_signs.responsive: "Yes, he's awake. He's acting like his usual self."
    danger_signs.chest_pain_now: "No, he doesn't seem to be in pain."
    danger_signs.breathing_difficulty: "No, he's breathing normally."
    danger_signs.heavy_bleeding: "No bleeding."
    complaint.category: "My baby has a fever. I called the paediatrician and she told me to bring him in."
    complaint.text: "My baby has a fever. I called the paediatrician and she told me to bring him in."
    complaint.onset: "I noticed it today."
    patient.age: "He's two weeks old."
    patient.age_days: "Two weeks, fourteen days."
    patient.sex: "He's a boy."
    complaint.fever: "Yes, he has a fever. I don't remember the exact number."
    ams.changed_from_baseline: "No, he's acting like himself and feeding normally."
    history.baseline_mental_status: "Yes, he's my baby, I know how he usually is."
    history.conditions: "He's healthy. It was a normal delivery."
    history.immunocompromised: "No."
    M.medications: "No medicines."
    M.anticoagulant: "No."
    A.allergies: "None that we know of."
    infection.rash: "No rash."
    infection.travel_14d: "No, we haven't travelled."
    identity.name: "Lim Wei Jie."
    identity.dob: "He was born on 4 October 2026."
    L.last_intake: "He fed not long ago."
