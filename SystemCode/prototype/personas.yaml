    limb.cast_too_tight: true
    patient.age: 35
    patient.sex: female
  say:
    danger_signs.responsive: "Yes, she's awake."
    danger_signs.chest_pain_now: "No."
    danger_signs.breathing_difficulty: "No."
    danger_signs.heavy_bleeding: "No."
    complaint.category: "She had a cast put on her broken wrist last night. Now her hand is really swollen and the cast is cutting into her fingers."
    complaint.text: "She had a cast put on her broken wrist last night. Now her hand is really swollen and the cast is cutting into her fingers."
