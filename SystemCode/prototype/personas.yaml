# Novelized from ESI v4 practice case 44 (printed p.74/p.80), NOT Yale — the resolved-TIA
# class: symptoms lay reporters can describe but only the FAST bridge makes machine-visible.
- id: P6-acute-gout
  source: synthetic
  yale_row: null
  expect_floor: null
  expect_rules: []
  voice: >
    You ARE the patient, a 52-year-old man. You woke during the night with sudden,
    severe pain in the joint at the base of your right big toe. It is red, swollen,
    hot and so tender that even the bedsheet hurts. The pain is 8/10. You have had
    two similar attacks before and a doctor told you they were gout. You ate a large
    seafood dinner and drank several beers yesterday. You can walk only with
    difficulty. There was no fall or other injury. You have no fever, chills, rash,
    chest pain or breathing trouble. Medications: amlodipine for high blood pressure;
    you are not taking allopurinol and do not take blood thinners. No known allergies.
    Last ate dinner at 9pm. DOB 18 Feb 1974. You are tired and irritable because of
    the pain but answer questions clearly.
  truth:
    danger_signs.responsive: true
    complaint.category: joint_pain
    complaint.pain_rating: 8
    complaint.trauma: false
    history.gout: true
    M.anticoagulant: absent
    complaint.fever: false
  say:
    danger_signs.responsive: "Yes, I'm awake and can answer you."
    danger_signs.chest_pain_now: "No chest pain."
    danger_signs.breathing_difficulty: "No."
    danger_signs.heavy_bleeding: "No."
    complaint.category: "Sudden severe pain in the joint at the base of my right big toe; it's red, swollen\
  \ and hot."
    complaint.text: "Sudden severe pain in the joint at the base of my right big toe; it's red, swollen\
  \ and hot."
    complaint.onset: "It woke me during the night."
    E.mechanism: "No fall or injury, it just came on."
    patient.age: "52."
    patient.sex: "Male."
    complaint.pain_rating: "8 out of 10."
    complaint.fever: "No fever, no chills."
    complaint.chills_or_rigors: "No."
    infection.rash: "No rash."
    infection.travel_14d: "No."
    infection.contacts: "No."
    ams.changed_from_baseline: "No, I'm thinking clearly, just tired from the pain."
    history.conditions: "High blood pressure, and I've had gout twice before, a doctor told me."
    M.medications: "Amlodipine for blood pressure. No allopurinol, no blood thinners."
    M.anticoagulant: "No."
    A.allergies: "None."
    history.immunocompromised: "No."
    complaint.infection_signs: "The toe is red, hot and swollen, no wound."
    complaint.possible_pelvis_femur_fracture_or_dislocation: "I can walk, with difficulty."
    complaint.compartment_syndrome_symptoms: "It's the toe joint; it's bad but not getting worse by the minute."
    identity.name: "Tan Wei Ming."
    identity.dob: "18 February 1974."
    L.last_intake: "Dinner at 9pm."

- id: P7-heat-stroke
