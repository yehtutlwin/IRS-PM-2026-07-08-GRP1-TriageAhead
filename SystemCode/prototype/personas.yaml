    work in direct sun. He had complained of headache, nausea and dizziness, then
    became confused and fell to the ground. He did not strike his head. He is now very
    hot, weak and responding only with confused words. An infrared thermometer reads
    40.4 degrees Celsius. You have called an ambulance and moved him into the shade.
