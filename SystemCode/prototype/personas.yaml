# Five personas novelized from real Yale ED rows (see ../prototype-seeds.json).
# 'truth' is the answer sheet extraction is scored against. Names are fictional.
# P6-P8 are wholly synthetic additions and are not derived from Yale ED rows.
# `say` (16 Oct 2026): one sentence per field, the deterministic persona player's replies (PERSONA_BACKEND=sheet in the harness):
# the harness answers each question with the sentences of the fields it asks, or "I don't know." Authored from the voice
# paragraph by the builder; the same reply every time, so repeat runs measure fact extraction alone.
- id: P1-fall-anticoag
  yale_row: 1048            # 87M, cc_fall>65, on anticoagulants, real ESI 2
  expect_floor: "at least ESI-2"
  expect_rules: [B-30.anticoagulated-trauma]
  voice: >
    You are the DAUGHTER of Mr. Tan Ah Kow, 87. He fell down 4 steps at home an hour
    ago, landed on his right hip, cannot stand. You are anxious but cooperative. He is
    awake and talking. No head strike, no blackout. He takes "a small pill to thin his
    blood" - you only remember the name "warfarin" if directly asked to check the box.
    Also a blood pressure pill you can't name. Allergy: penicillin (rash). Conditions:
    irregular heartbeat, high blood pressure. His pain is 7/10. No fever/rash/travel.
    Last ate lunch (porridge) at 1pm. DOB 02 Jan 1939.
  truth:
    danger_signs.responsive: true
    complaint.category: injury
    E.mechanism: fall
    E.head_strike: false
    E.loc: false
    M.anticoagulant: true
    complaint.pain_rating: 7
    complaint.fever: false
    history.conditions: ["atrial fibrillation or irregular heartbeat", "hypertension"]
  say:
    danger_signs.responsive: "Yes, he's awake and talking."
    danger_signs.chest_pain_now: "No chest pain."
    danger_signs.breathing_difficulty: "No, he's breathing fine."
    danger_signs.heavy_bleeding: "No bleeding."
    complaint.category: "He fell down 4 steps at home and landed on his right hip. He can't stand."
    complaint.text: "He fell down 4 steps at home and landed on his right hip. He can't stand."
    complaint.onset: "About an hour ago."
    E.mechanism: "He fell down the steps."
    E.fall_height_meters: "He fell down 4 steps, about a metre."
    E.head_strike: "No, he didn't hit his head."
    E.loc: "No, he didn't black out."
    patient.age: "He's 87."
    patient.sex: "He's a man, my father."
    complaint.pain_rating: "He says the pain is 7 out of 10."
    complaint.fever: "No fever."
    infection.rash: "No rash."
    infection.travel_14d: "No, he hasn't travelled."
    infection.contacts: "No, nobody sick around him."
    ams.changed_from_baseline: "No, he's as alert as usual."
    history.baseline_mental_status: "Yes, I know him well, he's normally sharp."
    M.medications: "He takes a small pill to thin his blood, and a blood pressure pill, I don't know\
  \ its name."
    M.anticoagulant: "Yes, I checked the box, it's warfarin."
    A.allergies: "He's allergic to penicillin, it gives him a rash."
    history.conditions: "He has an irregular heartbeat and high blood pressure."
    history.immunocompromised: "No, nothing like that."
    identity.name: "Tan Ah Kow."
    identity.dob: "2 January 1939."
    L.last_intake: "He had porridge for lunch at 1pm."
    complaint.possible_pelvis_femur_fracture_or_dislocation: "He can't put any weight on the leg."
    complaint.compartment_syndrome_symptoms: "The hip hurts a lot but it's not getting worse by the minute."
    E.abdominal_trauma: "No, he landed on his hip."

