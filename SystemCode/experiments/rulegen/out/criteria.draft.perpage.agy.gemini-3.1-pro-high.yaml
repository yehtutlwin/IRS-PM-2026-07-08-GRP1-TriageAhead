      field: history.postpartum
    - equals: true
      field: complaint.heavy_vaginal_bleeding
- assessed_via: observed
  decision_point: A
  id: A-82.pregnancy-hemodynamic-instability
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: Any pregnancy-capable patient, whether pregnant or postpartum, who presents with significant hemodynamic
    instability and who needs immediate lifesaving interventions should be triaged as ESI level 1.
  when:
    all:
    - equals: true
      field: patient.pregnancy_capable
    - equals: true
      field: obs.hemodynamically_unstable
    - equals: true
      field: obs.requires_lifesaving_intervention
- assessed_via: reported
  decision_point: B
  id: B-101.testicular-scrotal-pain
  notes: Operationalized 'immediately evaluated' and 'time-sensitive clinical situation' as ESI 2.
  provenance: operationalized
  source: ESI v5 p.14 (Genitourinary)
  span: Testicular or scrotal pain should be immediately evaluated for testicular torsion
  when:
    field: complaint.category
    in:
    - testicular_pain
    - scrotal_pain
- assessed_via: reported
  decision_point: B
  id: B-102.unilateral-lower-quadrant-ovaries
  notes: Operationalized 'evaluated for ovarian torsion and ectopic pregnancy' as time-sensitive / ESI
    2.
  provenance: operationalized
  source: ESI v5 p.14 (Genitourinary)
  span: unilateral lower quadrant pain in patients with ovaries should be evaluated for ovarian torsion
    and ectopic pregnancy
  when:
    all:
    - equals: true
      field: complaint.unilateral_lower_quadrant_pain
    - equals: true
      field: patient.has_ovaries
- assessed_via: reported
  decision_point: B
  id: B-103.uti-elderly-or-systemic
  provenance: verbatim
  source: ESI v5 p.14 (Genitourinary)
  span: The patient with symptoms of a UTI who is elderly (Liang,  2017) or who also complains of back
    pain, chills, and rigors may have urosepsis and should also be assigned to ESI 2.
  when:
    all:
    - equals: uti_symptoms
      field: complaint.category
    - any:
      - equals: elderly
        field: patient.age_group
      - all:
        - equals: true
          field: complaint.back_pain
        - equals: true
          field: complaint.chills_or_rigors
- assessed_via: reported
  decision_point: B
  id: B-104.severe-flank-pain
  provenance: verbatim
  source: ESI v5 p.14 (Genitourinary)
  span: Patients presenting with severe flank pain receive a level-2 designation
  when:
    equals: true
    field: complaint.severe_flank_pain
- assessed_via: reported
  decision_point: B
  id: B-105.fall-6-meters
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: falls of 20 feet (6 meters) or more
  when:
    field: E.fall_height_meters
    gte: 6
- assessed_via: reported
  decision_point: B
  id: B-106.vehicle-ejection
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: ejection from a vehicle
  when:
    equals: true
    field: E.vehicle_ejection
- assessed_via: reported
  decision_point: B
  id: B-107.mechanical-extrication
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: removal from a vehicle with mechanical extrication tools
  when:
    equals: true
    field: E.mechanical_extrication
- assessed_via: reported
  decision_point: B
  id: B-108.sexual-assault
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: sexual assault
  when:
    equals: true
    field: complaint.sexual_assault
- assessed_via: reported
  decision_point: B
  id: B-109.penetrating-trauma-trunk-head-neck
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: penetrating trauma of the head, neck, chest, and abdomen without signs of hemodynamic instability
  when:
    all:
    - equals: penetrating
      field: E.mechanism
    - field: E.body_region
      in:
      - head
      - neck
      - chest
      - abdomen
- assessed_via: observed
  decision_point: B
  id: B-110.extremity-neurovascular-compromise
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: extremity injury with compromised neurovascular function
  when:
    equals: true
    field: complaint.extremity_neurovascular_compromise
- assessed_via: observed
  decision_point: B
  id: B-111.compartment-syndrome
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: symptoms of compartment syndrome
  when:
    equals: true
    field: complaint.compartment_syndrome_symptoms
- assessed_via: observed
  decision_point: B
  id: B-112.amputation
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: partial or complete amputations
  when:
    equals: true
    field: complaint.amputation_partial_or_complete
- assessed_via: observed
  decision_point: B
  effect_override: consider
  id: B-113.possible-pelvis-femur-fracture-dislocation
  provenance: verbatim
  source: ESI v5 p.15 (Trauma)
  span: possible fractures of the pelvis, femur, or dislocations
  when:
    equals: true
    field: complaint.possible_pelvis_femur_fracture_or_dislocation
- assessed_via: reported
  decision_point: B
  id: B-114.toxic-ingestion
  provenance: verbatim
  source: ESI v5 p.15 (Ingestions)
  span: Toxic ingestion is a high-risk presentation
  when:
    equals: true
    field: complaint.known_toxic_ingestion
- assessed_via: observed
  decision_point: B
  effect_override: consider
  id: B-115.unexplained-ams-breathing-rhythm
  provenance: verbatim
  source: ESI v5 p.15 (Ingestions)
  span: alterations in mental status, difficulty breathing, changes in breathing pattern, or changes in
    heart rate and/or rhythm without an obvious cause
  when:
    equals: true
    field: obs.unexplained_ams_breathing_or_rhythm_change
- assessed_via: reported
  decision_point: B
  id: B-116.transplant-infection-fever
  provenance: verbatim
  source: ESI v5 p.15 (Transplant)
  span: Patients presenting with a fever or other indication of infection or rejection should be designated
    ESI level 2
  when:
    all:
    - equals: true
      field: history.transplant_recipient_or_listed
    - any:
      - equals: true
        field: complaint.fever
      - equals: true
        field: complaint.infection_signs
      - equals: true
        field: obs.transplant_rejection_signs
- assessed_via: reported
  decision_point: B
  effect_override: consider
  id: B-117.transplant-list
  provenance: verbatim
  source: ESI v5 p.15 (Transplant)
  span: Patients who are on a transplant list are also usually considered high-risk.
  when:
    equals: true
    field: history.transplant_recipient_or_listed
- assessed_via: observed
  decision_point: B
  id: B-118.danger-self-others
  provenance: verbatim
  source: ESI v5 p.15 (Mental and Behavioral Health)
  span: danger either to themselves, others, or the environment
  when:
    equals: true
    field: complaint.danger_to_self_or_others
- assessed_via: observed
  decision_point: B
  id: B-119.psychiatric-high-risk
  provenance: verbatim
  source: ESI v5 p.15 (Mental and Behavioral Health)
  span: suicidal, homicidal, psychotic, or violent
  when:
    equals: true
    field: obs.suicidal_homicidal_psychotic_or_violent
- assessed_via: vitals
  decision_point: A
  id: A-83.elderly-dizziness-extreme-hr
  notes: Operationalized specific example in text for ESI 1 rule for elderly with dizziness and extreme
    HR. Assumed elderly as age >= 65.
  provenance: operationalized
  source: ESI v5 p.23
  span: elderly patient who presents with dizziness might be found to have a life-threatening condition
    when a heart rate of 32 beats/minute or 180 beats/minute is discovered
  when:
    all:
    - equals: true
      field: complaint.dizziness
    - field: patient.age
      gte: 65
    - any:
      - field: vitals.heart_rate
        lte: 32
      - field: vitals.heart_rate
        gte: 180
- assessed_via: vitals
  decision_point: B
  id: B-120.neonate-fever
  provenance: verbatim
  source: ESI v5 p.23 (Pediatric Vital Signs)
  span: An infant less than 28 days old with a fever is considered high risk and is assigned to at least
    ESI level 2.
  when:
    all:
    - field: patient.age_days
      lt: 28
    - equals: true
      field: complaint.fever
- assessed_via: vitals
  decision_point: D
  id: D-61.hr-rr-under-1mo
  notes: Extracted from column-formatted table Figure 6-1 for < 1 mo.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age_months
      lt: 1
    - any:
      - field: vitals.heart_rate
        gt: 190
      - field: vitals.respiratory_rate
        gt: 60
- assessed_via: vitals
  decision_point: D
  id: D-62.hr-rr-1-to-12mo
  notes: Extracted from column-formatted table Figure 6-1 for 1-12 mo.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age_months
      gte: 1
    - field: patient.age_months
      lte: 12
    - any:
      - field: vitals.heart_rate
        gt: 180
      - field: vitals.respiratory_rate
        gt: 55
- assessed_via: vitals
  decision_point: D
  id: D-63.hr-rr-1-to-3y
  notes: Extracted from column-formatted table Figure 6-1 for 1-3 y.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 1
    - field: patient.age
      lte: 3
    - any:
      - field: vitals.heart_rate
        gt: 140
      - field: vitals.respiratory_rate
        gt: 40
- assessed_via: vitals
  decision_point: D
  id: D-64.hr-rr-3-to-5y
  notes: Extracted from column-formatted table Figure 6-1 for 3-5 y.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 3
    - field: patient.age
      lte: 5
    - any:
      - field: vitals.heart_rate
        gt: 120
      - field: vitals.respiratory_rate
        gt: 35
- assessed_via: vitals
  decision_point: D
  id: D-65.hr-rr-5-to-12y
  notes: Extracted from column-formatted table Figure 6-1 for 5-12 y.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 5
    - field: patient.age
      lte: 12
    - any:
      - field: vitals.heart_rate
        gt: 120
      - field: vitals.respiratory_rate
        gt: 30
- assessed_via: vitals
  decision_point: D
  id: D-66.hr-rr-over-12y
  notes: Extracted from column-formatted table Figure 6-1. Combined 12-18 y and > 18 y as thresholds are
    identical.
  provenance: operationalized
  source: ESI v5 p.23 (Figure 6-1)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gt: 12
    - any:
      - field: vitals.heart_rate
        gt: 100
      - field: vitals.respiratory_rate
        gt: 20
- assessed_via: vitals
  decision_point: D
  id: D-67.spo2-under-92
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1)
  span: SpO2 < 92%
  when:
    field: vitals.spo2
    lt: 92
- assessed_via: vitals
  decision_point: B
  effect_override: consider
  id: B-121.infant-under-90-days-fever
  notes: Directly assigns infant < 90 days with temp > 38 to consider high risk.
  provenance: verbatim
  source: ESI v5 p.24 (Pediatric Temperatures)
  span: Temperature greater than 38°C (100.4°F) in an infant younger than 90 days old is a red flag and
    the patient should be considered high risk and assigned at least ESI level 2.
  when:
    all:
    - field: patient.age_days
      lt: 90
    - field: vitals.temp_c
      gt: 38
- assessed_via: vitals
  decision_point: B
  effect_override: consider
  id: B-122.pediatric-hypothermia
  notes: Operationalized 'child of any age' to age < 18 years. Effect set to 'consider' as it is labeled
    a 'Red Flag' concerning for sepsis.
  provenance: operationalized
  source: ESI v5 p.24 (Pediatric Temperatures)
  span: A temperature less than 36°C (96.8°F) in a child of any age is hypothermic and concerning for
    sepsis
  when:
    all:
    - field: patient.age
      lt: 18
    - field: vitals.temp_c
      lt: 36
- assessed_via: vitals
  decision_point: B
  effect_override: consider
  id: B-123.child-over-3-months-fever
  notes: Table 6-2 explicitly lists this as a Pediatric Temperature Red Flag. The hypothermia component
    is covered by the separate pediatric hypothermia rule.
  provenance: verbatim
  source: ESI v5 p.24 (Table 6-2)
  span: '> 3 months old

    > 38.5 °C (101.3°F) or < 36°C (96.8°F)'
  when:
    all:
    - field: patient.age_months
      gt: 3
    - field: vitals.temp_c
      gt: 38.5
