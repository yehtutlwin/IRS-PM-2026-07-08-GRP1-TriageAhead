- id: A-61.active-seizure
  decision_point: A
  when:
    field: obs.active_seizure
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: active seizure
- id: A-62.ineffective-airway-clearance
  decision_point: A
  when:
    field: obs.airway_occluded_or_ineffective_clearance
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Ineffective airway clearance
- id: A-63.obtunded-unresponsive
  decision_point: A
  when:
    field: obs.avpu
    in:
    - P
    - U
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Obtunded/unresponsive patient
- id: A-64.spo2-respiratory-compromise
  decision_point: A
  when:
    all:
    - field: vitals.spo2
      lt: 90
    - field: vitals.spo2_is_patients_norm
      equals: false
    - field: obs.respiratory_compromise_signs
      equals: true
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: SpO2 < 90% that is not the patient’s norm, with other signs of respiratory compromise
- id: A-65.anaphylaxis
  decision_point: A
  when:
    field: obs.anaphylaxis
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Anaphylaxis
- id: A-66.hypotension-hypoperfusion
  decision_point: A
  when:
    all:
    - field: vitals.hypotension
      equals: true
    - field: obs.hypoperfusion_signs
      equals: true
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Hypotension with signs of hypoperfusion
- id: A-67.hypoglycemia
  decision_point: A
  when:
    field: vitals.profound_hypoglycemia
    equals: true
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Hypoglycemia
- id: A-68.extreme-heart-rate
  decision_point: A
  when:
    field: vitals.extreme_heart_rate
    equals: true
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Severe bradycardia or tachycardia
- id: A-69.flaccid-infant
  decision_point: A
  when:
    all:
    - field: obs.flaccid
      equals: true
    - field: patient.age_group
      equals: infant
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Flaccid infant
- id: A-70.cardiac-pulmonary-arrest
  decision_point: A
  when:
    field: obs.cardiac_or_pulmonary_arrest
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: Cardiac and/or pulmonary arrest (or appears to be imminent)
- id: A-71.penetrating-trauma-lifesaving
  decision_point: A
  when:
    all:
    - field: E.mechanism
      equals: penetrating
    - field: E.body_region
      in:
      - head
      - neck
      - abdomen
      - chest
    - field: obs.requires_lifesaving_intervention
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 9 (Decision Point A)
  span: "Penetrating trauma of head, neck, abdomen, chest requiring  \na lifesaving intervention"
- id: A-72.severe-respiratory-distress-lifesaving
  decision_point: A
  when:
    all:
    - field: obs.severe_respiratory_distress
      equals: true
    - field: obs.requires_lifesaving_intervention
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 13 (Respiratory Concerns)
  span: Patients in severe respiratory distress who require immediate lifesaving intervention, such as
    intubation, meet level-1 criteria.
- id: A-73.unstable-chest-pain-lifesaving
  decision_point: A
  when:
    all:
    - field: complaint.acs_suspicion
      equals: true
    - field: obs.hemodynamically_unstable
      equals: true
    - field: obs.requires_lifesaving_intervention
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 13 (Cardiovascular)
  span: Patients with chest pain who are physiologically unstable and require immediate interventions
    such as intubation or hemodynamic support should be triaged as ESI level 1.
- id: A-74.pregnant-postpartum-hemodynamic-instability-lifesaving-intervention
  decision_point: A
  when:
    all:
    - field: history.pregnant_or_postpartum
      equals: true
    - field: obs.hemodynamically_unstable
      equals: true
    - field: obs.requires_lifesaving_intervention
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: Any pregnancy-capable patient, whether pregnant or postpartum, who presents with significant hemodynamic
    instability and who needs immediate lifesaving interventions should be triaged as ESI level 1.
- id: B-100.toxic-ingestion
  decision_point: B
  when:
    field: complaint.known_toxic_ingestion
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Toxic ingestion is a high-risk presentation which needs to be rapidly evaluated.
- id: B-101.toxic-ingestion-unexplained-changes
  decision_point: B
  when:
    field: obs.unexplained_ams_breathing_or_rhythm_change
    equals: true
  effect_override: consider
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Patients who present with alterations in mental status, difficulty breathing, changes in breathing
    pattern, or changes in heart rate and/or rhythm without an obvious cause should be evaluated as a
    possible toxic ingestion (Chandran & Krishna, 2019).
- id: B-102.transplant-fever-or-infection
  decision_point: B
  when:
    all:
    - field: history.transplant_recipient_or_listed
      equals: true
    - any:
      - field: complaint.fever
        equals: true
      - field: complaint.infection_signs
        equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Patients presenting with a fever or other indication of infection or rejection should be designated
    ESI level 2 due to their immunocompromised status.
- id: B-103.transplant-list
  decision_point: B
  when:
    field: history.transplant_recipient_or_listed
    equals: true
  effect_override: consider
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Patients who are on a transplant list are also usually considered high-risk.
- id: B-104.mental-health-danger
  decision_point: B
  when:
    field: complaint.danger_to_self_or_others
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Patients who are suicidal, homicidal, psychotic, or violent should be assigned an ESI level of
    2 (Sands et al., 2014).
- id: B-105.infant-under-28-days-fever
  decision_point: B
  when:
    all:
    - field: patient.age_days
      lt: 28
    - field: complaint.fever
      equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p. 23 (Pediatric Vital Signs)
  span: An infant less than 28 days old with a fever is considered high risk and is assigned to at least
    ESI level 2.
- id: B-106.fever-infant-under-90-days
  decision_point: B
  when:
    all:
    - field: patient.age_days
      lt: 90
    - field: vitals.temp_c
      gt: 38
  effect_override: consider
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p. 24 (Pediatric Temperatures)
  span: Temperature greater than 38°C (100.4°F) in an infant younger than 90 days old is a red flag and
    the patient should be considered high risk and assigned at least ESI level 2.
- id: B-61.active-chest-pain-acs
  decision_point: B
  when:
    field: complaint.acs_suspicion
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Active chest pain, suspicious for acute coronary syndrome but does not require an immediate lifesaving
    intervention.
- id: B-62.stroke-signs
  decision_point: B
  when:
    field: complaint.stroke_signs
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Signs of a stroke but does not meet level-1 criteria.
- id: B-63.possible-ectopic-pregnancy
  decision_point: B
  when:
    field: complaint.possible_ectopic_pregnancy
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: A possible ectopic pregnancy, hemodynamically stable.
- id: B-64.chemotherapy-immunocompromised-fever
  decision_point: B
  when:
    all:
    - field: history.immunocompromised
      equals: true
    - field: complaint.fever
      equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: A patient on chemotherapy, and therefore immunocompromised, with a fever.
- id: B-65.transplant-fever-or-infection
  decision_point: B
  when:
    all:
    - field: history.transplant_recipient_or_listed
      equals: true
    - any:
      - field: complaint.fever
        equals: true
      - field: complaint.infection_signs
        equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Transplant recipient presenting with a fever or other indication of infection.
- id: B-66.actively-suicidal-or-homicidal
  decision_point: B
  when:
    field: complaint.danger_to_self_or_others
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Actively suicidal or homicidal patient
- id: B-67.needle-stick-healthcare-worker
  decision_point: B
  when:
    field: complaint.needle_stick_healthcare_worker
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: A needle stick in a health care worker (time sensitive to postexposure prophylaxis treatment)
- id: B-68.sexual-assault-survivor
  decision_point: B
  when:
    field: complaint.sexual_assault
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Sexual assault survivor
- id: B-69.increasing-respiratory-effort
  decision_point: B
  when:
    field: complaint.increasing_respiratory_effort
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Increasing respiratory effort
- id: B-70.postpartum-hemorrhage
  decision_point: B
  when:
    field: complaint.postpartum_hemorrhage
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (High-Risk Situations)
  span: Postpartum hemorrhage
- id: B-71.new-confusion-lethargy-disorientation
  decision_point: B
  when:
    field: obs.new_confusion_lethargy_disorientation
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.12 (New Onset Confusion, Lethargy, or Disorientation)
  span: If the patient’s history is unknown, and the patient presents as confused, lethargic, or disoriented,
    the nurse should assume this condition is new and assign an ESI level 2.
- id: B-72.pain-rating-seven-or-greater
  decision_point: B
  effect_override: consider
  when:
    field: complaint.pain_rating
    gte: 7
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (Severe Pain or Distress)
  span: All patients who have a pain rating of 7/10 or greater should be considered for meeting ESI level-2
    criteria.
- id: B-73.severe-pain-systemic-disruption
  decision_point: B
  when:
    all:
    - field: complaint.pain_rating
      gte: 7
    - field: complaint.pain_cause_class
      equals: systemic_disruption
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.12 (Severe Pain or Distress)
  span: Patients experiencing severe pain or distress as a result of a systemic disruption, for example,
    renal colic, cancer, or sickle cell crisis, should be triaged as ESI level 2
- id: B-74.headache-red-flags
  decision_point: B
  when:
    all:
    - field: complaint.category
      equals: headache
    - any:
      - field: complaint.fever
        equals: true
      - field: obs.confusion_lethargy_disorientation
        equals: true
      - field: complaint.stroke_signs
        equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.12 (Neurological Concerns)
  span: Other presentations of concern that warrant an ESI 2 designation include headache plus fever,
    vomiting, lower back pain, altered mental status, and/or signs and symptoms of stroke, including gross
    deficits such as aphasia, apraxia, agnosia, or dysarthria (Zweifler, 2017).
- id: B-75.post-ictal-presentation
  decision_point: B
  when:
    field: obs.confusion_lethargy_disorientation
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p.12 (Neurological Concerns)
  span: Patients presenting post-ictal are triaged as ESI level 2 (altered mental status).
- id: B-76.high-risk-or-deterioration
  decision_point: B
  when:
    any:
    - field: obs.high_risk_situation
      equals: true
    - field: obs.risk_of_deterioration
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.11 (Decision Point B: High-Risk Presentation)'
  span: If the situation is high-risk or the patient is at elevated risk for physical or psychological
    deterioration, the patient is triaged as ESI level 2.
- id: B-77.acute-mental-status-change
  decision_point: B
  when:
    field: obs.new_confusion_lethargy_disorientation
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.11 (Decision Point B: High-Risk Presentation)'
  span: Does the patient have an acute change in mental status?
- id: B-78.severe-pain-or-distress
  decision_point: B
  when:
    field: obs.severe_pain_or_distress
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.11 (Decision Point B: High-Risk Presentation)'
  span: Is the patient in severe pain or distress (physiological or psychological)?
- id: B-79.geriatric-vitals-and-medications
  decision_point: B
  effect_override: consider
  when:
    all:
    - field: patient.age
      gte: 65
    - field: obs.abnormal_vitals
      equals: true
  assessed_via: vitals
  provenance: operationalized
  notes: Operationalized age threshold of 65 based on the text's reference to studies showing individuals
    65 and older are at increased risk of under-triage.
  source: 'ESI v5 p.11 (Decision Point B: High-Risk Presentation)'
  span: Consider vital signs in the context of medications before assigning an ESI level.
- id: B-80.pediatric-subtle-mental-status-change
  decision_point: B
  when:
    all:
    - field: patient.age_group
      equals: pediatric
    - field: obs.subtle_mental_status_change
      equals: true
  effect_override: consider
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p. 13 (Decision Point B: High-Risk Presentation?)'
  span: A subtle change in a pediatric patient’s mental status can be suggestive of a change in hemodynamics
    and should be immediately investigated as high risk.
- id: B-81.secretions-or-stridor
  decision_point: B
  when:
    any:
    - field: obs.cannot_manage_secretions
      equals: true
    - field: obs.stridor
      equals: true
  assessed_via: observed
  provenance: verbatim
  source: ESI v5 p. 13 (Ear, Nose, and Throat Concerns)
  span: Patients who are unable to manage their own secretions and/or exhibit respiratory stridor are
    extremely high-risk patients and should be assigned an ESI level of 2.
- id: B-82.high-risk-epistaxis
  decision_point: B
  when:
    any:
    - field: complaint.brisk_or_posterior_bleeding
      equals: true
    - all:
      - field: complaint.category
        equals: epistaxis
      - any:
        - field: history.thrombocytopenia_or_clotting_disorder
          equals: true
        - field: M.anticoagulant.status
          equals: active
  assessed_via: reported
  provenance: operationalized
  source: ESI v5 p. 13 (Ear, Nose, and Throat Concerns)
  span: Several etiologies of epistaxis represent high-risk situations. Examples include brisk bleeding
    secondary to posterior nosebleed or when experienced by a patient with known thrombocytopenia, clotting
    dyscrasias, and use of warfarin or other anti-coagulants (Krulewitz & Fix, 2019; Hamlett et al., 2021).
    In these situations, patients are assigned an ESI level of 2.
  notes: Operationalized epistaxis high-risk presentation criteria to include brisk/posterior bleeding
    or epistaxis in patients with known coagulopathy or active anticoagulant therapy.
- id: B-83.button-battery-ingestion
  decision_point: B
  when:
    field: complaint.button_battery_or_magnet_ingestion
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p. 13 (Ear, Nose, and Throat Concerns)
  span: Esophageal button battery ingestion has a high risk of complication, especially in children less
    than 6 years of age and involving batteries greater than 20 mm in diameter (Mubarak et al., 2021).
    This presentation is extremely time sensitive.
- id: B-84.abnormal-ecg-chest-pain
  decision_point: B
  when:
    all:
    - field: complaint.acs_suspicion
      equals: true
    - field: obs.unexplained_ams_breathing_or_rhythm_change
      equals: true
  assessed_via: observed
  provenance: operationalized
  source: ESI v5 p. 13 (Cardiovascular)
  span: If the ECG is abnormal, patients would be assigned level 2.
  notes: Operationalized ECG abnormality in a patient evaluated for chest pain as an ESI level 2 criteria.
- id: B-85.pregnant-postpartum-sbp-abnormal
  decision_point: B
  when:
    all:
    - field: history.pregnant_or_postpartum
      equals: true
    - any:
      - field: vitals.sbp
        lt: 90
      - field: vitals.sbp
        gt: 150
  assessed_via: vitals
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: The pregnant or postpartum patient with a SBP of < 90 or > 150 should be designated an ESI 2 even
    in the absence of other symptoms (Hauspurg & Jeyabalan, 2022; Prejbisz et al., 2019).
- id: B-86.pregnant-high-risk-symptoms
  decision_point: B
  when:
    all:
    - field: history.pregnant_or_postpartum
      equals: true
    - any:
      - field: complaint.category
        equals: chest_pain
      - field: complaint.increasing_respiratory_effort
        equals: true
      - field: complaint.category
        equals: abdominal_pain
      - field: complaint.category
        equals: headache
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: Pregnant patients with chest pain and/or shortness of breath, abdominal pain, or headache (Sperling
    et al., 2015) should be triaged as ESI 2 and rapidly assessed by ED and/or OB providers.
- id: B-87.pregnant-heavy-vaginal-bleeding-infection-suspicion
  decision_point: B
  when:
    all:
    - field: history.pregnant_or_postpartum
      equals: true
    - field: complaint.vaginal_bleeding
      equals: heavy
    - field: obs.infection_signs
      equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: Pregnant patients who present with heavy vaginal bleeding and abnormal vitals with suspicion of
    infection should be categorized at ESI level 2.
- id: B-88.postpartum-heavy-vaginal-bleeding
  decision_point: B
  when:
    all:
    - field: history.pregnant_or_postpartum
      equals: true
    - field: complaint.postpartum_hemorrhage
      equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.14 (Obstetrical and Gynecological Concerns)
  span: Postpartum patients presenting with heavy vaginal bleeding should also be assigned ESI level 2
    and seen by a provider immediately (Borovac-Pinheiro et al., 2018).
- id: B-89.uti-high-risk-urosepsis
  decision_point: B
  when:
    all:
    - field: complaint.category
      equals: uti_symptoms
    - any:
      - field: patient.age_group
        equals: geriatric
      - all:
        - field: complaint.category
          equals: back_pain
        - field: complaint.infection_signs
          equals: true
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.14 (Genitourinary)
  span: The patient with symptoms of a UTI who is elderly (Liang, 2017) or who also complains of back
    pain, chills, and rigors may have urosepsis and should also be assigned to ESI 2.
- id: B-90.severe-flank-pain
  decision_point: B
  when:
    all:
    - field: complaint.category
      equals: flank_pain
    - field: complaint.pain_rating
      equals: severe
  assessed_via: reported
  provenance: verbatim
  source: ESI v5 p.14 (Genitourinary)
  span: Patients presenting with severe flank pain receive a level-2 designation (Gelber & Singh, 2021).
- id: B-91.fall-20-feet
  decision_point: B
  when:
    field: E.fall_height_meters
    gte: 6
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Mechanisms of injury that warrant an ESI 2 designation include falls of 20 feet (6 meters) or
    more, ejection from a vehicle, or removal from a vehicle with mechanical extrication tools, and sexual
    assault.
- id: B-92.ejection-from-vehicle
  decision_point: B
  when:
    field: E.vehicle_ejection
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Mechanisms of injury that warrant an ESI 2 designation include falls of 20 feet (6 meters) or
    more, ejection from a vehicle, or removal from a vehicle with mechanical extrication tools, and sexual
    assault.
- id: B-93.mechanical-extrication
  decision_point: B
  when:
    field: E.mechanical_extrication
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Mechanisms of injury that warrant an ESI 2 designation include falls of 20 feet (6 meters) or
    more, ejection from a vehicle, or removal from a vehicle with mechanical extrication tools, and sexual
    assault.
- id: B-94.sexual-assault
  decision_point: B
  when:
    field: complaint.sexual_assault
    equals: true
  assessed_via: reported
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Mechanisms of injury that warrant an ESI 2 designation include falls of 20 feet (6 meters) or
    more, ejection from a vehicle, or removal from a vehicle with mechanical extrication tools, and sexual
    assault.
- id: B-95.penetrating-trauma-hemodynamically-stable
  decision_point: B
  when:
    all:
    - field: E.body_region
      in:
      - head
      - neck
      - chest
      - abdomen
    - field: E.mechanism
      equals: penetrating
    - field: obs.hemodynamically_unstable
      equals: false
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Injuries that warrant an ESI level of 2 may include penetrating trauma of the head, neck, chest,
    and abdomen without signs of hemodynamic instability.
- id: B-96.neurovascular-compromise
  decision_point: B
  when:
    field: complaint.extremity_neurovascular_compromise
    equals: true
  assessed_via: observed
  provenance: verbatim
  source: 'ESI v5 p.15 (Decision Point B: High-Risk Presentation)'
  span: Patients with high-risk orthopedic injuries include those presenting with any extremity injury
