- assessed_via: reported
  decision_point: B
  effect_override: consider
  id: B-105.transplant-list
  provenance: verbatim
  source: ESI v5 p.15 (Transplant)
  span: Patients who are on a transplant list are also usually considered high-risk.
  when:
    equals: true
    field: history.transplant_recipient_or_listed
- assessed_via: reported
  decision_point: B
  id: B-106.danger-to-self-or-others
  provenance: verbatim
  source: ESI v5 p.15 (Mental and Behavioral Health)
  span: Patients who are suicidal, homicidal, psychotic, or violent should be assigned an ESI level of
    2
  when:
    equals: true
    field: complaint.danger_to_self_or_others
- assessed_via: reported
  decision_point: B
  id: B-107.infant-under-28-days-fever
  provenance: verbatim
  source: ESI v5 p.23 (Pediatric Vital Signs)
  span: An infant less than 28 days old with a fever is considered high risk and is assigned to at least
    ESI level 2.
  when:
    all:
    - field: patient.age_days
      lt: 28
    - equals: true
      field: complaint.fever
- assessed_via: vitals
  decision_point: A
  id: A-78.unstable-extreme-heart-rate
  provenance: verbatim
  source: 'ESI v5 p.23 (Decision Point D: High Risk Vital Signs?)'
  span: An awake, alert elderly patient who presents with dizziness might be found to have a life-threatening
    condition when a heart rate of 32 beats/minute or 180 beats/minute is discovered during vital sign
    measurement.
  when:
    any:
    - field: vitals.heart_rate
      lte: 32
    - field: vitals.heart_rate
      gte: 180
- assessed_via: vitals
  decision_point: D
  id: D-61.high-risk-vitals-under-1-month
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age_months
      lt: 1
    - any:
      - field: vitals.heart_rate
        gt: 190
      - field: vitals.respiratory_rate
        gt: 60
- assessed_via: vitals
  decision_point: D
  id: D-62.high-risk-vitals-1-to-12-months
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age_months
      gte: 1
    - field: patient.age_months
      lte: 12
    - any:
      - field: vitals.heart_rate
        gt: 180
      - field: vitals.respiratory_rate
        gt: 55
- assessed_via: vitals
  decision_point: D
  id: D-63.high-risk-vitals-1-to-3-years
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 1
    - field: patient.age
      lte: 3
    - any:
      - field: vitals.heart_rate
        gt: 140
      - field: vitals.respiratory_rate
        gt: 40
- assessed_via: vitals
  decision_point: D
  id: D-64.high-risk-vitals-3-to-5-years
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 3
    - field: patient.age
      lte: 5
    - any:
      - field: vitals.heart_rate
        gt: 120
      - field: vitals.respiratory_rate
        gt: 35
- assessed_via: vitals
  decision_point: D
  id: D-65.high-risk-vitals-5-to-12-years
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 5
    - field: patient.age
      lte: 12
    - any:
      - field: vitals.heart_rate
        gt: 120
      - field: vitals.respiratory_rate
        gt: 30
- assessed_via: vitals
  decision_point: D
  id: D-66.high-risk-vitals-12-to-18-years
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gte: 12
    - field: patient.age
      lte: 18
    - any:
      - field: vitals.heart_rate
        gt: 100
      - field: vitals.respiratory_rate
        gt: 20
- assessed_via: vitals
  decision_point: D
  id: D-67.high-risk-vitals-over-18-years
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: High-risk vital signs?
  when:
    all:
    - field: patient.age
      gt: 18
    - any:
      - field: vitals.heart_rate
        gt: 100
      - field: vitals.respiratory_rate
        gt: 20
- assessed_via: vitals
  decision_point: D
  id: D-68.high-risk-vitals-spo2-below-92
  provenance: verbatim
  source: ESI v5 p.23 (Figure 6-1. High-Risk Vital Signs)
  span: SpO2 < 92%
  when:
    field: vitals.spo2
    lt: 92
- assessed_via: vitals
  decision_point: D
  effect_override: consider
  id: D-69.pediatric-fever-under-90-days
  provenance: verbatim
  source: ESI v5 p.24 (Pediatric Temperatures)
  span: Temperature greater than 38°C (100.4°F) in an infant younger than 90 days old is a red flag and
    the patient should be considered high risk and assigned at least ESI level 2.
  when:
    all:
    - field: patient.age_days
      lt: 90
    - field: vitals.temp_c
      gt: 38
- assessed_via: vitals
  decision_point: D
  id: D-70.pediatric-hypothermia
  provenance: verbatim
  source: ESI v5 p.24 (Pediatric Temperatures)
  span: A temperature less than 36°C (96.8°F) in a child of any age is hypothermic and concerning for
    sepsis (Balamuth et al., 2017).
  when:
    field: vitals.temp_c
    lt: 36
