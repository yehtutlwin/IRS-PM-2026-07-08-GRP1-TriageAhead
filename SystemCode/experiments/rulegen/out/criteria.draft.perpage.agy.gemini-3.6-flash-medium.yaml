  id: B-81.atso-ophthalmic-urgency
  notes: Operationalized 'more symptoms in constellation predicting a more emergent problem' as ATSO element
    count of 2 or more.
  provenance: operationalized
  source: ESI v5 p.13 (Ocular Concerns)
  span: The Alphabetic Triage score for Ophthalmology (ATSO) score (D’Oria et al., 2020) may be useful
    in stratifying risk; the elements of the score that predict urgency include the presence of altered
    vision; sudden diplopia, anisocoria, or exophthalmos; red eye; distress/pain (specifically intolerable
    pain); eye trauma; and “floaters and flashers,” with more symptoms in constellation predicting a more
    emergent problem and serve as a good guideline for the triage nurse.
  when:
    field: complaint.atso_elements_count
    gte: 2
