    complaint.onset: This afternoon
    patient.age: He is seventy-nine.
    patient.sex: He is male.
    complaint.fever: No temperature checked
    M.medications: Several daily tablets, names unknown
    A.allergies: Unknown
    history.conditions: High blood pressure
