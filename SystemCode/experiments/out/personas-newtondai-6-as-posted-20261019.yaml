- id: P20-infant-fever
  source: 'Independent fictional caregiver scenario (Issue #29); clinical rule references are candidate evidence,
    not a patient record.'
  expect_floor: at least ESI-2
  expect_rules:
  - B-57.infant-under-90-days-temperature-over-38
  voice: 'You are the mother of a 6-week-old baby with a measured temperature of 38.3 C this morning. The baby is
    feeding less and is sleepier than usual but wakes when handled. You are frightened and answer in short sentences.
    No rash, breathing difficulty or known medical problems. Reference for reviewer only: Rule B-57, ESI v5 printed
    p.24 as quoted in criteria.yaml; ESI v4 p.8 only says consider ESI-2 for 1-3 months. Verify original v5 page
    and clinician interpretation.'
  truth:
    complaint.text: infant fever
    complaint.onset: This morning
    patient.age_days: 42
    patient.age_months: 1.5
    complaint.fever: true
    vitals.temp_c: 38.3
    patient.sex: female
    complaint.category: fever
  say:
    danger_signs.responsive: She wakes when I pick her up, but she is sleepier and feeding less than usual.
    danger_signs.chest_pain_now: 'No'
    danger_signs.breathing_difficulty: 'No'
    danger_signs.heavy_bleeding: 'No'
    complaint.category: My six-week-old baby has a fever.
    complaint.text: My six-week-old baby has a fever.
    complaint.onset: This morning
    patient.age: My baby is six weeks old.
    patient.sex: She is a girl.
    complaint.fever: Yes. I measured 38.3 degrees Celsius this morning.
    M.medications: No medicines
    A.allergies: No known allergies
    history.conditions: No known conditions
    L.last_intake: Milk about two hours ago
    vitals.temp_c: The thermometer showed 38.3 degrees Celsius.
    patient.age_days: Six weeks, about forty-two days.
- id: P22-teen-self-harm-concern
  source: 'Independent fictional caregiver scenario (Issue #29); clinical rule references are candidate evidence,
    not a patient record.'
  expect_floor: at least ESI-2
  expect_rules:
  - B-09.suicidal-or-homicidal
  voice: 'You are the aunt of a 16-year-old who told you today that they feel unsafe and have thoughts of hurting
    themselves. They are awake and speaking but withdrawn. You are unsure whether they have taken any tablets and
    do not want to guess. Reference for reviewer only: Rule B-09, ESI v5 printed pp.12,15 as quoted in criteria.yaml;
    ESI v4 printed pp.12,20 supports suicidal presentation as high-risk. Clarify current intent and possible ingestion.'
  truth:
    complaint.text: thoughts of self-harm
    complaint.onset: Today
    patient.age: 16
    complaint.danger_to_self_or_others: true
    complaint.category: mental_health
  say:
    danger_signs.responsive: Yes, the patient is awake and can respond.
    danger_signs.chest_pain_now: 'No'
    danger_signs.breathing_difficulty: No breathing problem
    danger_signs.heavy_bleeding: 'No'
    complaint.category: My niece or nephew told me they have thoughts of hurting themselves.
    complaint.text: My niece or nephew told me they have thoughts of hurting themselves.
    complaint.onset: Today
    patient.age: They are sixteen.
    patient.sex: I am not sure how they identify; please ask them directly.
    complaint.fever: No fever known
    M.medications: Unknown; I have not checked
    A.allergies: Unknown
    history.conditions: Unknown
    L.last_intake: Unknown
    complaint.danger_to_self_or_others: They told me today they have thoughts of hurting themselves. I do not know
      whether they took any tablets.
    complaint.known_toxic_ingestion: I cannot confirm whether they swallowed any tablets.
