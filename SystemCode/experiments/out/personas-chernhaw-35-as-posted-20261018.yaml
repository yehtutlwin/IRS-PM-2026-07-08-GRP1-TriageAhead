- id: I29-18-abdominal-pain-and-bleeding
  # ESI v5 p.14: "Pregnant patients with chest pain and/or shortness of breath, abdominal pain, or headache (Sperling et al., 2015) should be triaged as ESI 2"; also "Abdominal pain with vaginal bleeding can suggest ectopic pregnancy or other emergent pregnancy complications"
  expect_floor: "at least ESI-2"
  expect_rules: [B-21.abdo-pain-vaginal-bleeding, B-38.pregnant-chest-pain-breathlessness-abdo-pain-or-headache]
  voice: >
    You are a 33-year-old woman who is about six weeks pregnant. You have lower
    abdominal pain and vaginal bleeding that began this morning. The pain is 5/10;
    you feel worried but have not fainted and are speaking normally. You take no
    regular medicines, have no known allergies, and have no fever. You came with your
    partner. If asked about bleeding, say it is more than spotting but not soaking
    a
    pad each hour.
  truth:
    complaint.category: abdominal_pain
    complaint.vaginal_bleeding: true
    history.pregnant: true
    complaint.pain_rating: 5
