- id: I29-02-resolved-stroke
  # ESI v5 p.12: "Signs of a stroke but does not meet level-1 criteria"
  expect_floor: "at least ESI-2"
  expect_rules: [B-05.stroke-signs]
  voice: >
    You are the husband of an 81-year-old woman. At 10 this morning her words became
    slurred and her right arm went weak for about 20 minutes. She is back to her usual
    self now, awake and talking, and you wonder if it was just tiredness. She has
    a
    history of high blood pressure and takes a daily blood pressure tablet whose name
    you do not know. No fall, injury, pain, fever, or blood thinner. When first asked
    what happened, say she seemed fine by the time you left home; describe the slurred
    speech and weak arm if asked what was unusual.
  truth:
    complaint.stroke_signs: true
    danger_signs.responsive: true
    history.conditions: [hypertension]
    M.anticoagulant: absent
    complaint.fever: false
    complaint.category: neuro_symptoms
    complaint.text: Her speech became slurred and her right arm became weak, but she is back to normal now.
