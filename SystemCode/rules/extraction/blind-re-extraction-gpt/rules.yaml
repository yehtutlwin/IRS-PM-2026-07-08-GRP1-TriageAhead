- id: gpt-012
  page: 5
  span: Both of these decisions may require a full set of vital signs and a focused assessment
  verb: may require
  decision_point: B
  kind: context
  effect: none
  interpretation: verbatim
  note: “Both” refers to the level-1 and level-2 decisions; this does not make vital signs or assessment sufficient for either level.
- id: gpt-013
  page: 5
  span: Decision point C is used only after level 1 and 2 are excluded
  verb: is used only after
  decision_point: C
  kind: usage
  effect: resource_band
  interpretation: verbatim
- id: gpt-014
  page: 5
  span: patients are determined to be physiologically stable with low risk for deterioration
  verb: are determined to be
  decision_point: C
  kind: rule
  effect: resource_band
  who_can_supply: observed
  when:
    all:
    - fact: is_physically_stable
      is: true
    - fact: has_low_risk_for_deterioration
      is: true
  interpretation: verbatim
  note: This is the stated condition for using decision point C after levels 1 and 2 are excluded; it does not by itself select level 3, 4, or 5.
- id: gpt-015
  page: 5
  span: ESI levels 3, 4, and 5 are based on how many resources the nurse anticipates will be used
  verb: are based on
  decision_point: C
  kind: rule
  effect: resource_band
  who_can_supply: observed
  when:
    all:
    - fact: anticipated_resource_types
      gte: 0
  interpretation: verbatim
- id: gpt-016
  page: 5
  also_on:
  - 6
  - 29
  span: None One Many
  verb: None One Many
  decision_point: C
  kind: rule
  effect: resource_band
  who_can_supply: observed
  when:
    all:
    - fact: anticipated_resource_types
      in:
      - 0
      - 1
      - 2
  interpretation: interpreted
  note: 'In Figure 2-1, the aligned outcomes are “5, 4, 3”: none resources corresponds to ESI 5, one to ESI 4, and many to ESI 3. “Many” is interpreted as two or
    more because the figure does not itself define that word.'
