- id: gpt-072
  page: 9
  also_on:
  - 6
  - 30
  span: When these signs are present, the patient is assigned an ESI level of 1.
  verb: is assigned an ESI level of 1
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    any:
    - fact: is_unresponsive
      is: true
    - fact: has_active_seizure
      is: true
    - fact: has_occluded_airway
      is: true
    - fact: has_ineffective_gas_exchange
      is: true
    - fact: has_ineffective_or_decreased_perfusion
      is: true
  interpretation: interpreted
  note: The preceding list says these signs “include” these five items; I interpret each listed sign as independently sufficient because the next sentence assigns
    level 1 when these signs are present. The text does not explicitly say each item alone is sufficient.
