entries:
- decision_point: C
  effect: resource_band
  id: gemini-001
  interpretation: verbatim
  kind: usage
  page: 1
  span: prediction of resources necessary to move the patient to a final disposition (admission, discharge, or transfer) is used to further differentiate patient
    acuity.
  verb: is used to further differentiate
- decision_point: none
  effect: none
  id: gemini-002
  interpretation: verbatim
  kind: negative
  note: States a negative rule differentiating ESI from other triage scales.
  page: 1
  span: The ESI does not define expected time intervals to physician evaluation.
  verb: does not define
- decision_point: none
  effect: none
  id: gemini-003
  interpretation: verbatim
  kind: definition
  page: 2
  span: The five groups reflect clinically meaningful differences in physiological and psychological stability based on the assessment of vital signs and projected
    resource needs.
  verb: reflect
- decision_point: none
  effect: none
  id: gemini-004
  interpretation: verbatim
  kind: usage
  page: 5
  span: The decision points must be performed in order, but higher acuity patients will only require one or two decision points to assign an acuity level.
  verb: must be performed in order
- decision_point: A
  effect: none
  id: gemini-005
  interpretation: verbatim
  kind: usage
  page: 5
  span: The first decision the triage nurse makes is regarding stability.
  verb: makes
- decision_point: C
  effect: none
  id: gemini-006
  interpretation: verbatim
  kind: usage
  page: 5
  span: If a patient does not meet high risk instability criteria (ESI level 1 or 2), the triage nurse then evaluates expected resource needs
  verb: evaluates
- decision_point: A
  effect: assign_level_1
  id: gemini-007
  interpretation: verbatim
  kind: rule
  page: 5
  span: Decision point A is the only one needed for ESI level-1 patients, who are defined as in need of immediate lifesaving intervention.
  verb: are defined as
  when:
    all:
    - fact: needs_immediate_lifesaving_intervention
      is: true
  who_can_supply: observed
- decision_point: B
  effect: assign_level_2
  id: gemini-008
  interpretation: verbatim
  kind: rule
  note: Text groups likely to deteriorate and require more immediate care with and/or.
  page: 5
  span: whether the patient is likely to deteriorate and/or require more immediate care based on symptom presentation and patient risk factors. These patients are
    assigned an ESI level of 2.
  verb: are assigned
  when:
    any:
    - fact: is_likely_to_deteriorate
      is: true
    - fact: requires_more_immediate_care
      is: true
  who_can_supply: observed
- decision_point: none
  effect: none
  id: gemini-009
  interpretation: verbatim
  kind: usage
  note: Refers to decision points A and B.
  page: 5
  span: Both of these decisions may require a full set of vital signs and a focused assessment prior to reaching such a determination.
  verb: may require
- decision_point: C
  effect: none
  id: gemini-010
  interpretation: verbatim
  kind: usage
  page: 5
  span: Decision point C is used only after level 1 and 2 are excluded and patients are determined to be physiologically stable with low risk for deterioration.
  verb: is used only after
- decision_point: C
  effect: resource_band
  id: gemini-011
  interpretation: verbatim
  kind: rule
  page: 5
  span: ESI levels 3, 4, and 5 are based on how many resources the nurse anticipates will be used to reach a disposition decision.
  verb: are based on
  when:
    any:
    - fact: anticipated_resources_none
      is: true
    - fact: anticipated_resources_one
      is: true
    - fact: anticipated_resources_many
      is: true
  who_can_supply: observed
- decision_point: D
  effect: reassess_uptriage
  id: gemini-012
  interpretation: verbatim
  kind: rule
  page: 5
  span: Decision point D incorporates vital signs to identify more subtle high-risk presentations or an immediate need for lifesaving interventions and to reassess
    the acuity decision, potentially resulting in assignment of a higher acuity level
  verb: potentially resulting in assignment of
  when:
    any:
    - fact: has_subtle_high_risk_presentation
      is: true
    - fact: needs_immediate_lifesaving_intervention
      is: true
  who_can_supply: vitals
- decision_point: A
  effect: none
  id: gemini-013
  interpretation: verbatim
  kind: context
  page: 5
  span: A. Is this patient unstable and in need of immediate lifesaving intervention?
  verb: Is this
- decision_point: B
  effect: none
  id: gemini-014
  interpretation: verbatim
  kind: context
  page: 5
  span: B. Is this a high-risk situation?
  verb: Is this
- decision_point: C
  effect: none
  id: gemini-015
  interpretation: verbatim
  kind: context
  page: 5
  span: C. How many resources will this patient need?
  verb: will this patient need
- decision_point: D
  effect: none
  id: gemini-016
  interpretation: verbatim
  kind: context
  page: 5
  span: D. Do the patient’s vital signs warrant a reassessment of the acuity level?
  verb: warrant
- decision_point: A
  effect: assign_level_1
  id: gemini-017
  interpretation: verbatim
  kind: rule
  note: Derived from Figure 2-1 conceptual algorithm diagram.
  page: 5
  span: Requires lifesaving intervention? ... Yes [arrows to] 1
  verb: ->
  when:
    all:
    - fact: needs_immediate_lifesaving_intervention
      is: true
  who_can_supply: observed
- decision_point: B
  effect: assign_level_2
  id: gemini-018
  interpretation: verbatim
  kind: rule
  note: Derived from Figure 2-1 conceptual algorithm diagram.
  page: 5
  span: High risk-confused/distress? ... Yes [arrows to] 2
  verb: ->
  when:
    any:
    - fact: is_high_risk_situation
      is: true
    - fact: is_confused
      is: true
    - fact: is_in_distress
      is: true
  who_can_supply: observed
- decision_point: C
  effect: resource_band
  id: gemini-019
  interpretation: verbatim
  kind: rule
  note: Derived from Figure 2-1 conceptual algorithm diagram linking None to 5, One to 4, Many to 3.
  page: 5
  span: How many resources? None One Many ... 5, 4, 3
  verb: ->
  when:
    any:
    - fact: anticipated_resources_none
      is: true
    - fact: anticipated_resources_one
      is: true
    - fact: anticipated_resources_many
      is: true
  who_can_supply: observed
- decision_point: D
  effect: reassess_uptriage
  id: gemini-020
  interpretation: verbatim
  kind: rule
  note: Derived from Figure 2-1 conceptual algorithm diagram.
  page: 5
  span: High-risk vital signs? ... Yes [arrows to] Reassess acuity decision
  verb: ->
  when:
    all:
    - fact: has_high_risk_vital_signs
      is: true
  who_can_supply: vitals
