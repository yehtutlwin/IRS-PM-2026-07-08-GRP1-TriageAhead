# rules/extraction/v5-complete-pass.yaml - one complete reading of the ESI handbook, 5th edition (ENA 2023), with a single aim:
# list EVERY sentence that assigns or conditions a level, a flag, a reassessment, or a rule about how levels are used.
# PROCESS: extracted from sources. One run, by Claude Fable 5.1 (an AI agent), 4 Oct 2026, reading the text of printed
# pages 1-30 (the reference lists excluded), constrained by rules/criteria.schema.json, rules/vocabulary.yaml and
# rules/fields.yaml. Each span is contiguous text from its printed page; rules/extraction/check_pass.py verifies that
# mechanically. NOT yet read by a person against the pages; NOT yet compared with another model's run. Issue #50.
# page = printed page number (PDF page = printed + 6).
# kind: level1 | level2 | consider | resources | vitals | governance | definition | negative | example
# disposition:
#   matches       the statement is already encoded by the listed rule(s) in rules/criteria.yaml
#   new           no rule encodes it; `proposal` is the id a new entry would take
#   refine        an existing rule or its field captures it only partly; `rule` names it
#   not_a_rule    context, a definition, or a statement that NO level follows; recorded so the pass is complete
#   test_material worked examples in the handbook itself

