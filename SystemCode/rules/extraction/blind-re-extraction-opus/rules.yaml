- id: D-004
  page: 6
  span: '> 190 > 180 > 140 > 120 > 120 > 100 > 100'
  decision_point: D
  kind: rule
  effect: reassess_uptriage
  who_can_supply: vitals
  when:
    all:
    - &id001
      fact: age_months
      lt: 1
    - fact: heart_rate_bpm
      gt: 190
  interpretation: interpreted
  note: 'Danger-zone figure, age band ''< 1 mo'': HR > 190. Column-to-row mapping read from the figure layout; band edges (inclusive lower, exclusive upper) are my reading because the printed bands share endpoints.'
