entries:
- id: N-001
  page: 1
  span: The ESI does not define expected time intervals to physician evaluation.
  decision_point: none
  kind: usage
  effect: none
  who_can_supply: n/a
  interpretation: verbatim
  note: ESI levels carry no target time to physician.
- id: C-001
  page: 1
  span: For patients determined to be stable, prediction of resources necessary to move the patient to a final disposition
  decision_point: C
  kind: definition
  effect: resource_band
  who_can_supply: n/a
  interpretation: verbatim
  note: Resource prediction differentiates acuity only among stable patients.
- id: N-002
  page: 2
  span: While patient throughput and flow is outside the scope of ESI
  decision_point: none
  kind: usage
  effect: none
  who_can_supply: n/a
  interpretation: verbatim
- id: N-003
  page: 5
  span: The decision points must be performed in order, but higher acuity patients will only require one or two decision points
  decision_point: none
  kind: usage
  effect: none
  who_can_supply: n/a
  interpretation: verbatim
- id: N-004
  page: 5
  span: The ESI is intended for use by nurses with both emergency nursing and triage experience.
  decision_point: none
  kind: usage
  effect: none
  who_can_supply: n/a
  interpretation: verbatim
- id: C-002
  page: 5
  span: If a patient does not meet high risk instability criteria (ESI level 1 or 2), the triage nurse then evaluates expected resource needs
  decision_point: C
  kind: usage
  effect: resource_band
  who_can_supply: n/a
  interpretation: verbatim
- id: A-001
  page: 5
  span: Decision point A is the only one needed for ESI level-1 patients, who are defined as in need of immediate lifesaving intervention.
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    all:
    - fact: needs_immediate_lifesaving_intervention
      is: true
  interpretation: verbatim
- id: B-001
  page: 5
  span: Decision point B is used to determine whether the patient is likely to deteriorate and/or require more immediate care
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    all:
    - fact: is_likely_to_deteriorate
      is: true
  interpretation: verbatim
  note: Followed by 'These patients are assigned an ESI level of 2.' Based on symptom presentation and patient risk factors.
- id: N-005
  page: 5
  span: Both of these decisions may require a full set of vital signs and a focused assessment prior to reaching such a determination.
  decision_point: none
  kind: usage
  effect: none
  who_can_supply: n/a
  interpretation: verbatim
- id: C-003
  page: 5
  span: Decision point C is used only after level 1 and 2 are excluded and patients are determined to be physiologically stable
  decision_point: C
  kind: usage
  effect: resource_band
  who_can_supply: n/a
  interpretation: verbatim
- id: C-004
  page: 5
  span: ESI levels 3, 4, and 5 are based on how many resources the nurse anticipates will be used to reach a disposition decision.
  decision_point: C
  kind: definition
  effect: resource_band
  who_can_supply: n/a
  interpretation: verbatim
- id: D-001
  page: 5
  span: Decision point D incorporates vital signs to identify more subtle high- risk presentations
  decision_point: D
  kind: definition
  effect: reassess_uptriage
  who_can_supply: n/a
  interpretation: verbatim
  note: D can identify subtle high-risk presentations or need for lifesaving intervention, potentially resulting in a higher acuity level.
- id: D-002
  page: 5
  span: Do the patient’s vital signs warrant a reassessment of the acuity level?
  decision_point: D
  kind: definition
  effect: reassess_uptriage
  who_can_supply: n/a
  interpretation: verbatim
- id: A-002
  page: 5
  span: Requires lifesaving intervention?
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    all:
    - fact: needs_immediate_lifesaving_intervention
      is: true
  interpretation: verbatim
  note: 'Algorithm figure, decision point A: yes leads to level 1.'
- id: B-002
  page: 5
  span: High risk-confused/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    all:
    - fact: is_high_risk_situation
      is: true
  interpretation: verbatim
  note: 'Algorithm figure, decision point B: yes leads to level 2.'
- id: B-003
  page: 5
  span: High risk-confused/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: reported
  when:
    all:
    - fact: has_new_altered_mental_status
      is: true
  interpretation: interpreted
  note: Conceptual figure merges 'high risk-confused/distress' into one box; the confusion element is read as new altered mental status.
- id: B-004
  page: 5
  span: High risk-confused/distress?
  decision_point: B
