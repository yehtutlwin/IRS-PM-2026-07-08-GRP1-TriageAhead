- id: A-004
  page: 6
  span: 'Immediate life-saving intervention required: Airway or respiratory support, emergency medications, hemodynamic interventions'
  decision_point: A
  kind: definition
  effect: assign_level_1
  who_can_supply: n/a
  interpretation: verbatim
  note: 'Defines immediate lifesaving intervention: airway or respiratory support, emergency medications, hemodynamic interventions (fluid resuscitation, blood products).'
- id: A-005
  page: 6
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia.'
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    all:
    - fact: is_intubated
      is: true
  interpretation: verbatim
  note: 'Clinical presentation requiring lifesaving intervention: Intubated patient.'
