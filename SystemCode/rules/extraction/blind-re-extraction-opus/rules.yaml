  decision_point: C
  kind: rule
  effect: resource_band
  who_can_supply: observed
  when:
    all:
    - fact: predicted_resource_count
      gte: 2
  interpretation: interpreted
  note: 'Figure: ''Many'' resources leads to level 3. ''Many'' read as two or more (stated in text on p.19).'
- id: C-006
