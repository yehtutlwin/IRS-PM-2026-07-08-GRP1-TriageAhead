  page: 30
  span: Crutches, splints, slings
  decision_point: C
  kind: definition
  effect: resource_band
  who_can_supply: n/a
  interpretation: verbatim
  note: Crutches, splints, slings are NOT a resource.
- id: D-090
  page: 30
  span: Reassess to determine whether the patient warrants a higher acuity level if a patient has one or more vital signs outside the normal parameters for the patient.
  decision_point: D
  kind: rule
  effect: reassess_uptriage
  who_can_supply: vitals
  when:
    all:
    - fact: vital_sign_outside_normal_for_patient
      is: true
  interpretation: verbatim
  note: Any one or more vital signs outside the normal parameters for this patient triggers reassessment for a higher level.
- id: D-091
  page: 30
  span: '1-28 days of age: Assign at least ESI 2 if T > 38° C'
  decision_point: D
  kind: rule
  effect: assign_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_days
      gte: 1
    - fact: age_days
      lte: 28
    - fact: temperature_celsius
      gt: 38
  interpretation: verbatim
  note: '''Assign at least ESI 2'' (level 1 still possible). Placed under D because the box sits with the vital-signs criteria; it is a level-2 rule.'
- id: D-092
  page: 30
  span: '1-3 months: Consider assigning ESI 2 if T > 38 ° C'
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_months
      gte: 1
    - fact: age_months
      lte: 3
    - fact: temperature_celsius
      gt: 38
  interpretation: verbatim
  note: '''Consider assigning ESI 2''. Overlaps with p.24 rule (under 90 days, >38 C, assign at least 2).'
- id: D-093
  page: 30
  span: T > 39°C (102.2°F) or < 36°C (96.8°F)
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - &id015
      fact: age_months
      gte: 3
    - &id016
      fact: age_years
      lt: 18
    - fact: temperature_celsius
      gt: 39
  interpretation: interpreted
  note: '''Consider assigning ESI 2 or 3''. Upper age bound (<18 y) assumed from ''Pediatric''.'
- id: D-094
  page: 30
  span: T > 39°C (102.2°F) or < 36°C (96.8°F)
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - *id015
    - *id016
    - fact: temperature_celsius
      lt: 36
  interpretation: interpreted
  note: '''Consider assigning ESI 2 or 3''. Upper age bound (<18 y) assumed from ''Pediatric''.'
- id: D-095
  page: 30
  span: Incomplete immunizations
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: reported
  when:
    all:
    - *id015
    - *id016
    - fact: has_fever
      is: true
    - fact: has_incomplete_immunizations
      is: true
  interpretation: interpreted
  note: '''Consider assigning ESI 2 or 3''. Fever assumed present because the box is ''Pediatric Fever Considerations''; <18 y assumed.'
- id: D-096
  page: 30
  span: No obvious source of fever
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: reported
  when:
    all:
    - *id015
    - *id016
    - fact: has_fever
      is: true
    - fact: has_identifiable_fever_source
      is: false
  interpretation: interpreted
  note: '''Consider assigning ESI 2 or 3''. Fever assumed present (box heading); <18 y assumed. ''No obvious source'' read as no identifiable source.'
