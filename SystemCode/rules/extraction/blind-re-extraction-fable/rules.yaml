  interpretation: verbatim
  note: '''at least'' ESI 2 (level 1 remains possible). Box ''Pediatric Fever Considerations''. p23 words it ''An infant less than 28 days old with a fever'' (day 28 excluded, no number for fever). p24 extends the assignment to ''an infant younger than 90 days old''.'
