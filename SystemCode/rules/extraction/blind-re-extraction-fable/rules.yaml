- id: B-104
  page: 14
  span: Testicular or scrotal pain should be immediately evaluated for testicular torsion
  verb: should be immediately evaluated for testicular torsion
  decision_point: B
  kind: rule
  effect: consider_level_2
  who_can_supply: reported_directly
  when:
    any:
    - fact: has_testicular_pain
      is: true
    - fact: has_scrotal_pain
      is: true
  interpretation: interpreted
  note: 'Not an assignment: the verb is ''should be immediately evaluated for''. Torsion is called ''a time-sensitive clinical situation capable of producing permanent organ loss'', which matches the p11 definition of high-risk, and the p12 section heading says these examples ''would warrant'' level 2; the stronger reading is therefore assign level 2 for any testicular or scrotal pain.'
- id: B-105
  page: 14
  span: unilateral lower quadrant pain in patients with ovaries should be evaluated for ovarian torsion and ectopic pregnancy
  verb: should be evaluated for ovarian torsion and ectopic pregnancy
  decision_point: B
  kind: rule
  effect: consider_level_2
  who_can_supply: reported_directly
  when:
