  page: 15
  span: Occult hypoperfusion with normal vital signs is associated with age greater than 55, and so a careful assessment should be made in the older patient
  verb: a careful assessment should be made in the older patient
  decision_point: B
  kind: rule
  effect: consider_level_2
  who_can_supply: reported_directly
  when:
    all:
    - fact: has_trauma
      is: true
    - fact: age_years
      gt: 55
  interpretation: interpreted
  note: 'No level in the sentence; ''careful assessment'' only. Recorded as consider with the stated association (age greater than 55) as the condition; the sentence''s own subject is ''the older patient'', which is not defined, and the other reading is effect none (context). Also: ''advanced age is a known risk factor for poor outcomes among trauma patients, and the severity of injury in older adults often exceeds what would normally be expected from the mechanism''. Normal vital signs do not reassure in this group.'
