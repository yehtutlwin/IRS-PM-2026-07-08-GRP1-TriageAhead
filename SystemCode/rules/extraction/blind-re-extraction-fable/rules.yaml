- id: B-068
  page: 13
  span: Examples include brisk bleeding secondary to posterior nosebleed or when experienced by a patient with known thrombocytopenia, clotting dyscrasias, and use of warfarin or other anti-coagulants
  verb: patients are assigned an ESI level of 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
