  who_can_supply: vitals
  when:
    all:
    - fact: is_pediatric_patient
      is: true
    - fact: temperature_celsius
      lt: 36
  interpretation: interpreted
  note: '''concerning'' names no level. Recorded as consider, in line with the fever box (''Consider assigning ESI 2 or 3'' for < 36°C at 3 months and older). The stronger reading would treat it like the high fever in the previous sentence. ''child'' has no upper age.'
- id: D-049
  page: 24
  span: < 90 days > 38°C (100.4°F) or < 36°C (96.8°F)
  verb: Pediatric Temperature Red Flags
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_days
      lt: 90
    - fact: temperature_celsius
      lt: 36
  interpretation: interpreted
  note: Row of Table 6-2 'Pediatric Temperature Red Flags'. 'Red flag' names no level; recorded as consider. Low-temperature half of the '< 90 days' row. (The high-temperature half, > 38°C, is the assignment in the running text above.) The fever box on p6 has no low-temperature item for infants under 3 months.
- id: D-050
  page: 24
  span: '> 3 months old > 38.5 °C (101.3°F) or < 36°C (96.8°F)'
  verb: Pediatric Temperature Red Flags
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_months
      gt: 3
    - fact: is_pediatric_patient
      is: true
    - fact: temperature_celsius
      gt: 38.5
  interpretation: interpreted
  note: 'Row of Table 6-2 ''Pediatric Temperature Red Flags''. ''Red flag'' names no level; recorded as consider. DIFFERENT THRESHOLD from the fever box (p6, p30): there ''3 months and older ... T > 39°C (102.2°F)''; here ''> 3 months old ... > 38.5 °C (101.3°F)''. Age edges also differ (''< 90 days'' / ''> 3 months old'' here; ''1-3 months'' / ''3 months and older'' in the box).'
- id: D-051
  page: 24
  span: '> 3 months old > 38.5 °C (101.3°F) or < 36°C (96.8°F)'
  verb: Pediatric Temperature Red Flags
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_months
      gt: 3
    - fact: is_pediatric_patient
      is: true
    - fact: temperature_celsius
      lt: 36
  interpretation: interpreted
  note: Row of Table 6-2 'Pediatric Temperature Red Flags'. 'Red flag' names no level; recorded as consider. Low-temperature half of the '> 3 months old' row; same threshold as the fever box.
- id: D-052
  page: 24
  span: The following cases are examples of the need for vital signs on every patient
  verb: the need for vital signs on every patient
  decision_point: D
  kind: usage
  effect: none
  interpretation: verbatim
  note: '''every patient'' is qualified on p23 (level 1 or 2 recognised immediately: not if it delays care).'
- id: D-053
  page: 24
  span: This patient meets the criteria for being uptriaged from level 3 to level 2 based on her vital signs
  verb: meets the criteria for being uptriaged from level 3 to level 2
  decision_point: D
  kind: example
  effect: assign_level_2
  interpretation: verbatim
  note: 'Example One: 28-year-old, generalized abdominal pain, last period 8 weeks ago; T 36.7°C, HR 120, RR 22, BP 92/50. ''Her increased heart rate, respiratory rate, and decreased blood pressure make her high risk''; possible ruptured ectopic pregnancy. Blood pressure is used although it is not in the figure. No mention of rechecking the vital signs.'
- id: D-054
  page: 24
  span: Based on vital sign assessment, the nurse should triage them to an ESI level 2
  verb: should triage them to an ESI level 2
  decision_point: D
  kind: example
  effect: assign_level_2
  interpretation: verbatim
  note: 'Example Two: 15-month-old, decreased appetite, low-grade temperature, numerous liquid stools, sitting quietly; T 38°C, HR 158, RR 42, BP 86/50, capillary refill 3 seconds. Level 3 before vital signs. ''tachypneic and tachycardic for their age'' (figure thresholds for 1-3 y: HR > 140, RR > 40).'
- id: D-055
  page: 25
  span: After assessing vital signs, the nurse should uptriage the patient to an ESI level 2
  verb: should uptriage the patient to an ESI level 2
  decision_point: D
  kind: example
  effect: assign_level_2
  interpretation: verbatim
  note: 'Example Three: 57-year-old, cough for multiple days; T 38.5°C, RR 26, HR 100, SpO2 90%. ''Their low oxygen saturation and increased respiratory rate are a concern.'' HR 100 is not above the > 100 threshold.'
- id: D-056
  page: 25
  span: In this case, the decision should be to assign the patient to ESI level 3
  verb: the decision should be to assign the patient to ESI level 3
  decision_point: D
  kind: example
  effect: resource_band
  interpretation: verbatim
  note: 'Example Four, a NEGATIVE case: 34-year-old, abdominal pain, vomiting, constipation; HR 102, RR 16, BP 132/80, SpO2 99%. ''The heart rate falls just outside the accepted parameter for the age of the patient, but other vital signs are within expected limits.'' One threshold exceeded by a small margin does not uptriage. This is in tension with the p25 summary (''uptriage ... if the vital signs remain out of range''): no recheck is described and the patient stays level 3.'
- id: D-057
  page: 25
  span: it is critical to consider that as a cause of her elevated heart rate and respiratory rate and uptriage the patient to an ESI 2
  verb: uptriage the patient to an ESI 2
  decision_point: D
  kind: example
  effect: assign_level_2
  interpretation: verbatim
  note: 'Example Five: 72-year-old with advanced COPD on home oxygen, infected cat bite on the hand, daily inhaled steroid; T 37.5°C, HR 105, RR 24, BP 138/80, SpO2 91% (her norm 90-91%). Meets level 3 by resources (labs, IV antibiotics). Vital signs fit her lung disease, but because of the steroid (''possible she will not mount a robust immune response'') and the infected bite, sepsis has to be considered and she is uptriaged. Shows that ''the patient''s norm'' does not cancel the reassessment when another explanation is possible.'
- id: D-058
  page: 25
  span: Vital signs can play a more important role in the evaluation of some patients at triage, especially those triaged as ESI level 3
  verb: can play a more important role
  decision_point: D
  kind: context
  effect: none
  interpretation: verbatim
  note: '''The range of vital signs may provide supporting data for potential indicators of serious illness.'''
- id: D-059
  page: 25
  span: If any of the high-risk vital signs are exceeded, it is recommended that the triage nurse reassess the patient and uptriage the patient from level 3 to level 2 if the vital signs remain out of range
  verb: it is recommended that the triage nurse reassess the patient and uptriage the patient from level 3 to level 2 if the vital signs remain out of range
  decision_point: D
  kind: rule
  effect: reassess_uptriage
  who_can_supply: vitals
  when:
    all:
    - fact: any_high_risk_vital_sign_exceeded
      is: true
    - fact: vital_signs_remain_out_of_range_on_reassessment
      is: true
  interpretation: interpreted
  note: 'STRONGEST statement of decision D: reassess, then uptriage if still out of range (''it is recommended''). DIFFERS from the p6/p30 legend (''Reassess to determine whether the patient warrants a higher acuity level''), from p5 (''potentially resulting in assignment of a higher acuity level as appropriate'') and from Example Four, where HR 102 stays level 3. Read here as a two-step condition (exceeded, and still exceeded on reassessment); ''reassess'' may instead mean reconsider the acuity rather than re-measure. Says ''from level 3'' only: patients who would be level 4 or 5 with a high-risk vital sign are not addressed here, although the figure draws decision D after ''5, 4, 3''.'
- id: N-018
  page: 27
  span: The purpose of ESI is to identify patients at risk of decompensation, assign acuity, and predict resources at the initial encounter
  verb: The purpose of ESI is
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: Stated three times on the page; the level describes the initial encounter only.
- id: N-019
  page: 27
  span: that ESI level should not be changed, unless the patient condition changes before they are placed from the waiting area
  verb: should not be changed, unless
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: A level may be changed only if the patient's condition changes while still waiting to be placed.
- id: N-020
  page: 27
  span: The only change that should be made is to increase acuity
  verb: The only change that should be made is to increase acuity
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: No downgrading. p7 says only that a change in condition 'can be reflected in an amended ESI level', without direction.
- id: N-021
  page: 27
  span: an appropriate note should be made in the medical record reflecting the patient’s change in condition and change in ESI level
  verb: should be made
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-022
  page: 27
  span: ESI is not intended as an ongoing measurement of patient acuity
  verb: is not intended as
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: '''It is only used to predict decompensation risk and resource allotment.'''
- id: N-023
  page: 27
  span: it is not appropriate to change the ESI once a patient has been seen by a physician or advanced practice provider
  verb: it is not appropriate to change
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-024
  page: 27
  span: Physicians, physician assistants, and advanced practice RNs, if they are appropriately trained in the use of ESI, can assess patients at the initial encounter and assign an ESI level
  verb: can assess patients at the initial encounter and assign an ESI level
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: 'Condition: appropriately trained. ''Triage is generally a nursing function.'' Compare p5/p7: ESI ''is intended for use by nurses''.'
- id: N-025
  page: 27
  span: It is not appropriate for a physician or advanced practice provider to assign a second ESI after the patient has been triaged by a nurse
  verb: It is not appropriate
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-026
  page: 27
  span: The assignment of an ESI level is the result of a clinical decision- making process that requires a history of present illness, brief focused assessment, and vital signs
  verb: requires
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: Three required inputs. 'Assigning an ESI level without an assessment may result in significant undertriage.'
- id: N-027
  page: 27
  span: Unless the patient is in extremis, an assessment including a full set of vital signs should be made before assigning an ESI level
  verb: should be made before assigning an ESI level
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: 'No preliminary level before assessment, except in extremis. Stronger than p5 (''may require a full set of vital signs'') and differently worded from p23 (level 1 or 2 immediately recognised: no vitals if it delays care).'
- id: N-028
  page: 27
  span: This is the only purpose of the ESI system, and it should not be used to calculate billing
  verb: should not be used to calculate billing
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: '''the only purpose'' = sorting patients at the initial encounter. The question also asks about staffing, which the answer does not address directly; p2 says the acuity burden based on ESI ''can inform staffing needs''.'
- id: N-029
  page: 27
  span: ESI levels are ordinal data, not interval data, and so cannot be meaningfully averaged
  verb: cannot be meaningfully averaged
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: '''In tracking acuity in each department, distribution by percentage should be used.'''
facts:
- name: requires_immediate_lifesaving_intervention
  meaning: The patient needs a lifesaving treatment right now (for example help with breathing, an emergency drug, or stopping heavy bleeding).
  type: bool
- name: at_elevated_risk_of_deterioration
  meaning: The nurse judges the patient is likely to get worse quickly, physically or psychologically.
  type: bool
- name: requires_more_immediate_care
  meaning: The nurse judges the patient needs to be seen sooner than a stable patient because of the symptoms and risk factors.
  type: bool
- name: is_intubated
  meaning: The patient arrives with a breathing tube already in place.
  type: bool
- name: is_unresponsive
  meaning: 'The patient does not respond: not speaking and not following commands, or reacting only to pain or not at all.'
  type: bool
- name: is_pulseless
  meaning: No pulse can be felt.
  type: bool
- name: is_apneic
  meaning: The patient is not breathing.
  type: bool
- name: respiratory_distress_severity
  meaning: How hard the patient is struggling to breathe, as judged by the nurse.
  type: enum
  values:
  - none
  - mild
  - moderate
  - severe
- name: has_profound_hypotension
  meaning: Blood pressure is extremely low (the handbook gives no number).
  type: bool
- name: has_hypoglycemia
  meaning: Blood sugar is low (the handbook gives no number).
  type: bool
- name: is_high_risk_situation
  meaning: 'The nurse judges this to be a high-risk situation: the patient could easily get worse or may have a condition that needs time-critical treatment.'
  type: bool
- name: is_confused
  meaning: The patient is confused.
  type: bool
- name: is_lethargic
  meaning: The patient is unusually drowsy or sluggish.
  type: bool
- name: is_disoriented
  meaning: The patient does not know who they are, where they are, or what the time is.
  type: bool
- name: mental_status_onset
  meaning: Whether the confusion, drowsiness or disorientation is new, is the patient's usual state, or cannot be established.
  type: enum
  values:
  - new
  - baseline
  - unknown
- name: has_severe_pain
  meaning: The patient reports severe pain and the nurse's observation agrees.
  type: bool
- name: has_severe_distress
  meaning: The patient is in severe distress, physical or emotional.
  type: bool
- name: has_vital_sign_outside_normal_parameters_for_patient
  meaning: At least one vital sign is outside what is normal for this particular patient.
  type: bool
- name: age_months
  meaning: The patient's age in months.
  type: number
- name: age_years
  meaning: The patient's age in years.
  type: number
- name: age_days
  meaning: The patient's age in days.
  type: number
- name: heart_rate_bpm
  meaning: Heart rate in beats per minute.
  type: number
- name: respiratory_rate_per_min
  meaning: Breathing rate in breaths per minute.
  type: number
- name: spo2_percent
  meaning: Oxygen saturation of the blood in percent, measured with a finger probe.
  type: number
- name: temperature_celsius
  meaning: Body temperature in degrees Celsius.
  type: number
- name: is_pediatric_patient
  meaning: The patient is a child (the handbook's tables run to 18 years; no upper age is stated in the rules).
  type: bool
- name: has_fever
  meaning: The patient has a fever (no number attached where this fact is used).
  type: bool
- name: has_incomplete_immunizations
  meaning: The patient has not had all the vaccinations due for their age.
  type: bool
- name: fever_has_identifiable_source
  meaning: There is an obvious reason for the fever, such as an ear infection.
  type: bool
- name: has_active_seizure
  meaning: The patient is having a seizure right now.
  type: bool
- name: has_occluded_airway
  meaning: The airway is blocked.
  type: bool
- name: has_impaired_gas_exchange
  meaning: The lungs are not getting oxygen into the blood or carbon dioxide out effectively.
  type: bool
- name: has_ineffective_perfusion
  meaning: Blood is not reaching the body's tissues adequately.
  type: bool
- name: has_ineffective_airway_clearance
  meaning: The patient cannot keep their airway clear.
  type: bool
- name: has_ineffective_respiratory_pattern
  meaning: The patient's pattern of breathing is not doing the job.
  type: bool
- name: is_obtunded
  meaning: The patient is very drowsy and barely responds.
  type: bool
- name: spo2_is_patients_norm
  meaning: This oxygen saturation is the patient's usual value.
  type: bool
- name: has_other_signs_of_respiratory_compromise
  meaning: Besides a low oxygen reading there are other signs that breathing is failing.
  type: bool
- name: has_anaphylaxis
  meaning: The patient is having a severe, sudden allergic reaction.
  type: bool
- name: has_hypotension
  meaning: Blood pressure is low (no number given).
  type: bool
- name: has_signs_of_hypoperfusion
  meaning: There are signs that blood is not reaching the tissues (for example cold, pale, clammy skin).
  type: bool
- name: has_severe_bradycardia
  meaning: The heart is beating extremely slowly (no number given).
  type: bool
- name: has_severe_tachycardia
  meaning: The heart is beating extremely fast (no number given).
  type: bool
- name: is_flaccid_infant
  meaning: The patient is a baby who is limp and floppy.
  type: bool
- name: has_cardiac_arrest
  meaning: The heart has stopped.
  type: bool
- name: has_pulmonary_arrest
  meaning: Breathing has stopped.
  type: bool
- name: arrest_appears_imminent
  meaning: The heart or breathing looks about to stop.
  type: bool
- name: has_penetrating_trauma_head
  meaning: Something has pierced the head (for example a stab or gunshot wound).
  type: bool
- name: has_penetrating_trauma_neck
  meaning: Something has pierced the neck.
  type: bool
- name: has_penetrating_trauma_abdomen
  meaning: Something has pierced the belly.
  type: bool
- name: has_penetrating_trauma_chest
  meaning: Something has pierced the chest.
  type: bool
- name: has_altered_mental_status
  meaning: The patient's alertness, awareness or behaviour has changed from what is normal for them.
  type: bool
- name: has_chest_pain
  meaning: The patient has chest pain now.
  type: bool
- name: suspicious_for_acute_coronary_syndrome
  meaning: The nurse suspects the chest pain comes from a heart attack or a threatened heart attack.
  type: bool
- name: has_signs_of_stroke
  meaning: The patient shows signs of a stroke, such as trouble speaking or understanding.
  type: bool
- name: has_possible_ectopic_pregnancy
  meaning: The patient may have a pregnancy growing outside the womb.
  type: bool
- name: has_hemodynamic_instability
  meaning: The circulation is unstable (blood pressure and pulse are not holding).
  type: bool
- name: is_on_chemotherapy
  meaning: The patient is receiving chemotherapy.
  type: bool
- name: is_transplant_recipient
  meaning: The patient has received an organ transplant.
  type: bool
- name: has_other_indication_of_infection
  meaning: There is a sign of infection other than fever.
  type: bool
- name: is_actively_suicidal
  meaning: The patient currently intends to kill themselves.
  type: bool
- name: is_actively_homicidal
  meaning: The patient currently intends to kill someone else.
  type: bool
- name: has_needle_stick_injury
  meaning: The patient has been pricked by a used needle.
  type: bool
- name: is_health_care_worker
  meaning: The patient works in health care.
  type: bool
- name: experienced_sexual_assault
  meaning: The patient has been sexually assaulted.
  type: bool
- name: has_increasing_respiratory_effort
  meaning: The patient is working harder and harder to breathe.
  type: bool
- name: has_postpartum_hemorrhage
  meaning: The patient is bleeding heavily after giving birth.
  type: bool
- name: pain_rating_0_to_10
  meaning: The pain score the patient gives, from 0 (none) to 10 (worst).
  type: number
- name: pain_or_distress_due_to_systemic_disruption
  meaning: 'The severe pain or distress comes from a body-wide or internal illness (examples given: kidney stone colic, cancer, sickle cell crisis) rather than a local injury.'
  type: bool
- name: is_distraught
  meaning: The patient is extremely upset.
  type: bool
- name: has_behavioral_outbursts_at_triage
  meaning: The patient has outbursts of behaviour at the triage desk.
  type: bool
- name: is_combative
  meaning: The patient is fighting or physically resisting.
  type: bool
- name: is_survivor_of_sexual_violence
  meaning: The patient has survived sexual violence.
  type: bool
- name: is_survivor_of_domestic_violence
  meaning: The patient has survived violence at home.
  type: bool
- name: has_acute_grief_reaction
  meaning: The patient is in the first intense shock of grief.
  type: bool
- name: has_suicidal_ideation
  meaning: The patient is thinking about killing themselves.
  type: bool
- name: has_suicide_plan
  meaning: The patient has a plan to kill themselves.
  type: bool
- name: has_attempted_suicide
  meaning: The patient has tried to kill themselves.
  type: bool
- name: has_prenatal_loss
  meaning: The patient has lost a pregnancy.
  type: bool
- name: has_thunderclap_headache
  meaning: A severe headache that came on very suddenly.
  type: bool
- name: has_headache
  meaning: The patient has a headache.
  type: bool
- name: has_neck_pain
  meaning: The patient has neck pain.
  type: bool
- name: has_nuchal_rigidity
  meaning: The neck is stiff and cannot be bent forward.
  type: bool
- name: has_vomiting
  meaning: The patient is vomiting.
  type: bool
- name: has_lower_back_pain
  meaning: The patient has pain in the lower back.
  type: bool
- name: is_post_ictal
  meaning: The patient is in the drowsy, confused state that follows a seizure.
  type: bool
- name: has_subtle_mental_status_change
  meaning: A small change in how alert or responsive the patient is, for example a child who is 'not acting right'.
  type: bool
- name: has_altered_vision
  meaning: The patient's sight has changed.
  type: bool
- name: has_sudden_diplopia
  meaning: The patient has suddenly started seeing double.
  type: bool
- name: has_anisocoria
  meaning: The two pupils are different sizes.
  type: bool
- name: has_exophthalmos
  meaning: An eye is bulging forward.
  type: bool
- name: has_red_eye
  meaning: The eye is red.
  type: bool
- name: has_intolerable_eye_pain
  meaning: The eye pain or distress is unbearable.
  type: bool
- name: has_eye_trauma
  meaning: The eye has been injured.
  type: bool
- name: has_floaters_and_flashers
  meaning: The patient sees drifting specks and flashes of light.
  type: bool
- name: unable_to_manage_own_secretions
  meaning: The patient cannot swallow their own saliva and is drooling.
  type: bool
- name: has_respiratory_stridor
  meaning: A harsh, high-pitched noise when breathing.
  type: bool
- name: has_epistaxis
  meaning: The patient has a nosebleed.
  type: bool
- name: epistaxis_bleeding_is_brisk
  meaning: The nosebleed is bleeding fast.
  type: bool
- name: epistaxis_is_posterior
  meaning: The nosebleed comes from the back of the nose.
  type: bool
- name: has_known_thrombocytopenia
  meaning: The patient is known to have a low platelet count.
  type: bool
- name: has_clotting_dyscrasia
  meaning: The patient has a blood-clotting disorder.
  type: bool
- name: takes_anticoagulant
  meaning: The patient takes warfarin or another blood thinner.
  type: bool
- name: has_button_battery_ingestion
  meaning: The patient has swallowed a button battery.
  type: bool
- name: has_earth_magnet_ingestion
  meaning: The patient has swallowed a strong (rare-earth) magnet.
  type: bool
- name: is_ventilating_and_oxygenating_adequately
  meaning: The patient is, for now, moving enough air and getting enough oxygen.
  type: bool
- name: has_potential_to_rapidly_deteriorate
  meaning: The nurse judges the patient could get worse fast.
  type: bool
- name: is_physiologically_unstable
  meaning: The body's vital functions are not stable.
  type: bool
- name: ecg_is_abnormal
  meaning: The heart tracing (ECG) is abnormal.
  type: bool
- name: has_abdominal_pain
  meaning: The patient has belly pain.
  type: bool
- name: is_pregnant
  meaning: The patient is pregnant.
  type: bool
- name: is_postpartum
  meaning: The patient has recently given birth (no time window is stated).
  type: bool
- name: has_signs_of_sepsis
  meaning: The patient shows signs of a severe body-wide reaction to infection.
  type: bool
- name: has_blunt_trauma_abdomen
  meaning: The belly has been hit or crushed without the skin being pierced.
  type: bool
- name: pain_refractory_to_analgesia
  meaning: Painkillers have not eased the pain.
  type: bool
- name: pain_is_constant
  meaning: The pain does not come and go; it is there all the time.
  type: bool
- name: pain_maximal_on_onset
  meaning: The pain was at its worst from the moment it started.
  type: bool
- name: systolic_bp_mmhg
  meaning: The upper (systolic) blood pressure number, in mm Hg.
  type: number
- name: has_shortness_of_breath
  meaning: The patient is short of breath.
  type: bool
- name: has_heavy_vaginal_bleeding
  meaning: 'Heavy vaginal bleeding: soaking a pad an hour, plum-sized clots, bright red bleeding that does not slow, or bleeding that increased after easing.'
  type: bool
- name: has_abnormal_vital_signs
  meaning: One or more vital signs are abnormal (no numbers given where this fact is used).
  type: bool
- name: has_suspicion_of_infection
  meaning: An infection is suspected.
  type: bool
- name: has_testicular_pain
  meaning: The patient has pain in a testicle.
  type: bool
- name: has_scrotal_pain
  meaning: The patient has pain in the scrotum.
  type: bool
- name: has_unilateral_lower_quadrant_pain
  meaning: Pain low in the belly on one side only.
  type: bool
- name: has_ovaries
  meaning: The patient has ovaries.
  type: bool
- name: has_suspected_testicular_torsion
  meaning: The nurse suspects a twisted testicle.
