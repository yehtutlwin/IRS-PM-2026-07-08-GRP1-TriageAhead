    - fact: is_postpartum
      is: true
    - fact: has_heavy_vaginal_bleeding
      is: true
  interpretation: verbatim
  note: Everyday signs as in the definition entry (pad an hour, plum-sized clots). No abnormal-vitals or infection condition, unlike the pregnant-patient sentence. Compare the p12 bullet 'Postpartum hemorrhage'.
- id: A-060
  page: 14
  span: Any pregnancy-capable patient, whether pregnant or postpartum, who presents with significant hemodynamic instability and who needs immediate lifesaving interventions should be triaged as ESI level 1
  verb: should be triaged as ESI level 1
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    all:
    - any:
      - fact: is_pregnant
        is: true
      - fact: is_postpartum
        is: true
    - fact: has_hemodynamic_instability
      is: true
    - fact: requires_immediate_lifesaving_intervention
      is: true
  interpretation: interpreted
  note: Read as limited to pregnant or postpartum patients ('whether pregnant or postpartum'); the other reading is any pregnancy-capable patient. Either way the operative condition is the general level-1 criterion (needs immediate lifesaving intervention). 'significant' is not quantified.
