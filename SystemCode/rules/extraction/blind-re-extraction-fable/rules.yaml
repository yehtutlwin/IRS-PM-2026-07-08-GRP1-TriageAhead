      is: true
    - fact: has_ovaries
      is: true
  interpretation: interpreted
  note: Not an assignment ('should be evaluated for'), and without 'immediately' (the testicular sentence has it; this one begins 'Similarly'). The p20 table has a level-3 example of right lower quadrant pain in a patient 'assigned male at birth'.
- id: B-106
  page: 14
  span: Males with testicular torsion may complain of severe pain, are easily recognized, and require rapid evaluation and surgical intervention in addition to rapid pain control
  verb: require rapid evaluation and surgical intervention
  decision_point: B
  kind: rule
  effect: consider_level_2
  who_can_supply: observed
  when:
    fact: has_suspected_testicular_torsion
    is: true
  interpretation: interpreted
  note: 'No level is named and ''require rapid evaluation'' is not an assignment, so recorded as consider. The stronger reading (level 2): torsion is described as ''time-sensitive ... capable of producing permanent organ loss'' (potential threat to organ, p11) and the p12 section heading says these examples ''would warrant an ESI level-2 assignment''. Torsion is a diagnosis, so the fact is the nurse''s suspicion of it.'
