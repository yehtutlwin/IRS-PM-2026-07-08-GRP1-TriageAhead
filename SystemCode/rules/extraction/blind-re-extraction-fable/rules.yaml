  span: If the situation is high-risk or the patient is at elevated risk for physical or psychological deterioration, the patient is triaged as ESI level 2
  verb: is triaged as ESI level 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    fact: is_high_risk_situation
    is: true
  interpretation: interpreted
  note: This is the sentence that turns every 'high-risk' label in the chapter into level 2. 'High-risk' itself is a judgement, kept as one yes/no fact.
