- id: N-009
  page: 6
  span: The algorithm assumes the user has sufficient clinical knowledge to identify physiologic instability, determine risk of deterioration, and anticipate resource needs
  verb: assumes the user has sufficient clinical knowledge
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: The three judgements the algorithm leaves to the user. Educational programs 'can be used to partially fill this gap for inexperienced clinicians but does not replace knowledge gained through clinical experience'.
- id: N-010
  page: 7
  span: it was not developed to be a means of updating or communicating a change in patient condition after the provider has seen the patient
  verb: was not developed to be
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-011
  page: 7
  span: Prior to a provider evaluation, a patient change in condition can be reflected in an amended ESI level
  verb: can be reflected in an amended ESI level
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: 'No direction of change is stated here. p27 narrows it: ''The only change that should be made is to increase acuity'', and only if the condition changes ''before they are placed from the waiting area''.'
- id: N-012
  page: 7
  span: What is critical to this process is documentation of the change in condition, the reason for the change in ESI level, and the resultant action by the nurse
  verb: What is critical to this process is documentation
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: Three things to document. p27 asks for a note 'reflecting the patient’s change in condition and change in ESI level'.
- id: N-013
  page: 7
  span: The ESI level assigned by the nurse should reflect the patient’s current risk, not the environmental conditions of the ED
  verb: should reflect the patient’s current risk
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: 'Environmental conditions named: crowding, boarding, staffing. Downgrading under pressure from colleagues is called ''A dangerous but not uncommon practice''.'
- id: N-014
  page: 7
  span: Nor should the ESI level be used to manipulate metrics such as door-to-ECG or door-to-CT times
  verb: Nor should the ESI level be used to
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-015
  page: 7
  span: Racial, age, and gender bias can impede accuracy in triage decision-making by causing nurses to ignore critical cues
  decision_point: none
  kind: context
  effect: none
  interpretation: verbatim
  note: 'Bias section: undertriage reported in minority populations, geriatric populations, women with chest pain; patients with behavioral health or substance use history and patients described as ''difficult'' are named as susceptible. No level is assigned.'
- id: N-016
  page: 7
  span: It is critically important for the nurse to self-reflect, identify implicit and explicit bias, and use that knowledge to mitigate barriers to accurate assessment in triage
  decision_point: none
  kind: context
  effect: none
  interpretation: verbatim
  note: 'Also: ''more-experienced nurses tend to undertriage and less experienced nurses to overtriage''.'
