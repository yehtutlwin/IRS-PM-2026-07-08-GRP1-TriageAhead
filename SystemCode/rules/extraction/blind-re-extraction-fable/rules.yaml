- id: B-094
  page: 14
  span: The pregnant or postpartum patient with a SBP of < 90 or > 150 should be designated an ESI 2 even in the absence of other symptoms
  verb: should be designated an ESI 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: vitals
  when:
    all:
    - any:
      - fact: is_pregnant
        is: true
      - fact: is_postpartum
        is: true
    - fact: systolic_bp_mmhg
      lt: 90
  interpretation: verbatim
  note: '''even in the absence of other symptoms'': the blood pressure alone suffices. Blood pressure is not among the vital signs in the decision-D figure.'
