entries:
- id: N-001
  page: 1
  span: The ESI does not define expected time intervals to physician evaluation
  verb: does not define
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: A level carries no waiting-time target, unlike ATS, CTAS and MTS.
- id: C-001
  page: 1
  span: prediction of resources necessary to move the patient to a final disposition (admission, discharge, or transfer) is used to further differentiate patient acuity
  verb: is used to further differentiate patient acuity
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: Applies only 'For patients determined to be stable'. Disposition list here is admission, discharge, or transfer; p19 lists discharge home, admission to an observation unit, transfer to another institution 'or others'.
- id: N-002
  page: 2
  span: The five groups reflect clinically meaningful differences in physiological and psychological stability based on the assessment of vital signs and projected resource needs
  decision_point: none
  kind: context
  effect: none
  interpretation: verbatim
  note: States what the five levels mean; no criterion.
- id: N-003
  page: 2
  span: Assessing the department’s patient acuity burden based on ESI can inform staffing needs
  verb: can inform staffing needs
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: Different from p27, where the FAQ on 'average acuity tracking, staffing, or billing' answers that sorting patients at the initial encounter 'is the only purpose of the ESI system'.
- id: N-004
  page: 2
  span: some departments utilize it to safely assign patients to treatment areas outside the main department
  verb: some departments utilize it
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: Prefaced by 'While patient throughput and flow is outside the scope of ESI'. Descriptive, not a rule.
- id: A-001
  page: 2
  span: the charge nurse understands that the patient is unstable
  decision_point: A
  kind: context
  effect: none
  interpretation: verbatim
  note: 'Illustration: ''level-1 patient'' is understood to mean an unstable patient.'
- id: N-005
  page: 5
  span: The decision points must be performed in order, but higher acuity patients will only require one or two decision points to assign an acuity level
  verb: must be performed in order
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
- id: N-006
  page: 5
  also_on:
  - 7
  span: The ESI is intended for use by nurses with both emergency nursing and triage experience
  verb: is intended for use by
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: p7 repeats as 'is meant for use by nurses with both emergency nursing and triage experience'. p27 additionally allows appropriately trained physicians, physician assistants and advanced practice RNs to assign a level at the initial encounter.
- id: C-002
  page: 5
  span: If a patient does not meet high risk instability criteria (ESI level 1 or 2), the triage nurse then evaluates expected resource needs to help determine a triage level
  verb: then evaluates expected resource needs to help determine a triage level
  decision_point: C
  kind: usage
  effect: resource_band
  interpretation: verbatim
  note: Resources are only looked at once levels 1 and 2 are excluded.
- id: N-007
  page: 5
  span: Acuity judgements are initially based on assessment of physiological or psychological stability and the need for immediate lifesaving intervention
  decision_point: none
  kind: context
  effect: none
  interpretation: verbatim
- id: A-002
  page: 5
  also_on:
  - 6
  - 9
  - 29
  span: Decision point A is the only one needed for ESI level-1 patients, who are defined as in need of immediate lifesaving intervention
  verb: ESI level-1 patients, who are defined as in need of immediate lifesaving intervention
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    fact: requires_immediate_lifesaving_intervention
    is: true
  interpretation: verbatim
  note: The master criterion of decision point A. Figures 2-1 (p5), 2-2 (p6), 3-1 (p9) and Appendix B (p29) print it as 'Requires (immediate) lifesaving intervention? Yes -> 1'.
- id: B-001
  page: 5
  span: Decision point B is used to determine whether the patient is likely to deteriorate and/or require more immediate care based on symptom presentation and patient risk factors
  verb: These patients are assigned an ESI level of 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    any:
    - fact: at_elevated_risk_of_deterioration
      is: true
    - fact: requires_more_immediate_care
      is: true
  interpretation: interpreted
  note: The verb is in the following sentence. Both conditions are judgements with no stated test ('likely to deteriorate', 'require more immediate care'); kept as two yes/no facts joined by 'and/or'.
- id: N-008
  page: 5
  span: Both of these decisions may require a full set of vital signs and a focused assessment prior to reaching such a determination
  verb: may require
  decision_point: none
  kind: usage
  effect: none
  interpretation: verbatim
  note: 'Soft (''may require'') for decisions A and B. p27 is stronger: ''Unless the patient is in extremis, an assessment including a full set of vital signs should be made before assigning an ESI level''. p23 goes the other way: patients immediately recognised as level 1 or 2 ''do not need vitals taken if it is going to delay initiation of care''.'
- id: C-003
  page: 5
  span: Decision point C is used only after level 1 and 2 are excluded and patients are determined to be physiologically stable with low risk for deterioration
  verb: is used only after
  decision_point: C
  kind: usage
  effect: none
  interpretation: verbatim
- id: C-004
  page: 5
  span: This step requires the anticipation of resources needed during a typical ED course for patients with similar presentations
  verb: requires the anticipation of resources
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: Resources are predicted from the typical course of similar patients, not from what this patient eventually receives.
- id: C-005
  page: 5
  span: ESI levels 3, 4, and 5 are based on how many resources the nurse anticipates will be used to reach a disposition decision
  verb: are based on
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
- id: D-001
  page: 5
  span: Decision point D incorporates vital signs to identify more subtle high-risk presentations or an immediate need for lifesaving interventions and to reassess the acuity decision
  verb: potentially resulting in assignment of a higher acuity level as appropriate
  decision_point: D
  kind: usage
  effect: reassess_uptriage
  interpretation: verbatim
  note: '''potentially ... as appropriate'': reassessment, not automatic uptriage. This sentence allows decision point D to uncover a need for lifesaving intervention (level 1), as does p23 (''Some patients may not be identified as ESI level 1 or 2 until vital signs are taken''); the p25 summary speaks only of ''from level 3 to level 2''.'
- id: A-003
  page: 6
  also_on:
  - 30
  span: 'Immediate life-saving intervention required: Airway or respiratory support, emergency medications, hemodynamic interventions such as fluid resuscitation or blood products'
  decision_point: A
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'Legend definition of a lifesaving intervention by three categories: airway or respiratory support; emergency medications; hemodynamic interventions (examples fluid resuscitation, blood products). Table 3-1 on p9 gives the item-level list.'
- id: A-004
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    fact: is_intubated
    is: true
  interpretation: effect_inferred
  note: 'List item under ''Clinical presentations requiring lifesaving interventions include the following''. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open (''include''). '
- id: A-005
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: reported_directly
  when:
    fact: is_unresponsive
    is: true
  interpretation: effect_inferred
  note: List item under 'Clinical presentations requiring lifesaving interventions include the following'. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open ('include'). Defined on the same page (two alternative definitions, see the next two entries).
- id: A-006
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: observed
  when:
    fact: is_pulseless
    is: true
  interpretation: effect_inferred
  note: List item under 'Clinical presentations requiring lifesaving interventions include the following'. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open ('include'). Family could say 'no pulse' but it needs checking by hand.
- id: A-007
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: reported_as_everyday_signs
  when:
    fact: is_apneic
    is: true
  interpretation: effect_inferred
  note: 'List item under ''Clinical presentations requiring lifesaving interventions include the following''. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open (''include''). Everyday sign: not breathing.'
- id: A-008
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: reported_as_everyday_signs
  when:
    fact: respiratory_distress_severity
    is: severe
  interpretation: effect_inferred
  note: 'List item under ''Clinical presentations requiring lifesaving interventions include the following''. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open (''include''). Everyday signs: struggling for breath, cannot speak. p13 words it more narrowly: ''Patients in severe respiratory distress who require immediate lifesaving intervention, such as intubation, meet level-1 criteria''.'
- id: A-009
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: vitals
  when:
    fact: has_profound_hypotension
    is: true
  interpretation: interpreted
  note: List item under 'Clinical presentations requiring lifesaving interventions include the following'. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open ('include'). 'profound' is not given a number; kept as a yes/no fact.
- id: A-010
  page: 6
  also_on:
  - 30
  span: 'Clinical presentations requiring lifesaving interventions include the following: intubated, unresponsive, pulselessness, apneic, severe respiratory distress, profound hypotension or hypoglycemia'
  verb: requiring lifesaving interventions include
  decision_point: A
  kind: rule
  effect: assign_level_1
  who_can_supply: vitals
  when:
    fact: has_hypoglycemia
    is: true
  interpretation: interpreted
  note: 'List item under ''Clinical presentations requiring lifesaving interventions include the following''. The sentence says the presentation requires lifesaving intervention; level 1 follows through decision point A (requires intervention -> 1). The list is open (''include''). Ambiguous scope: ''profound hypotension or hypoglycemia'' may mean ''profound hypoglycemia''. Read here as plain hypoglycemia because the p9 bullet list has an unqualified ''Hypoglycemia''; the other reading needs ''profound''. No glucose threshold is given anywhere.'
- id: A-011
  page: 6
  also_on:
  - 30
  span: Is nonverbal and not following commands (acutely)
  verb: Unresponsiveness is defined as a patient who either
  decision_point: A
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'First of two alternative definitions of ''unresponsive'' (joined by OR): nonverbal AND not following commands, AND acute. All three parts are needed for this branch.'
- id: A-012
  page: 6
  also_on:
  - 30
  span: Requires noxious stimulus (P or U on AVPU scale)
  verb: Unresponsiveness is defined as a patient who either
  decision_point: A
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'Second alternative definition of ''unresponsive'': responds only to a noxious (painful) stimulus, or not at all: P or U on the AVPU scale.'
- id: B-002
  page: 6
  also_on:
  - 30
  span: 'High-risk situation: May become unstable, have high risk for deterioration, or exhibit newly altered mental status'
  verb: May become unstable, have high risk for deterioration, or exhibit newly altered mental status
  decision_point: B
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'Legend definition of ''high-risk situation'': three alternatives. Note it folds newly altered mental status into ''high-risk situation'', while the figure lists confusion/lethargy/disorientation as a separate branch.'
- id: B-003
  page: 6
  also_on:
  - 30
  span: Severe pain or distress is determined by patient report, corroborated with clinical observation
  verb: is determined by patient report, corroborated with clinical observation
  decision_point: B
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'Both are needed: the patient''s report AND the nurse''s corroborating observation. A reported score alone does not establish ''severe pain or distress'' under this sentence.'
- id: B-004
  page: 6
  also_on:
  - 5
  - 11
  - 29
  span: High-risk situation? or Confused/lethargic/disoriented? or Severe pain/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    fact: is_high_risk_situation
    is: true
  interpretation: interpreted
  note: 'Figure 2-2 box at decision point B; the three questions are joined by ''or'' and the Yes arrow goes to 2, so each is sufficient alone in the figure. No verb: strength comes from the figure''s arrow. Also Figure 2-1 (p5, ''High risk-confused/distress?''), Figure 4-1 (p11), Appendix B (p29). ''High-risk situation'' is a judgement; kept as one yes/no fact. Same criterion in running text on p11: ''If the situation is high-risk ... the patient is triaged as ESI level 2''.'
- id: B-005
  page: 6
  also_on:
  - 5
  - 11
  - 29
  span: High-risk situation? or Confused/lethargic/disoriented? or Severe pain/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: reported_directly
  when:
    all:
    - any:
      - fact: is_confused
        is: true
      - fact: is_lethargic
        is: true
      - fact: is_disoriented
        is: true
    - fact: mental_status_onset
      is: new
  interpretation: interpreted
  note: 'Figure 2-2 box at decision point B; the three questions are joined by ''or'' and the Yes arrow goes to 2, so each is sufficient alone in the figure. No verb: strength comes from the figure''s arrow. Also Figure 2-1 (p5, ''High risk-confused/distress?''), Figure 4-1 (p11), Appendix B (p29). The figure does not say ''new''; the qualifier comes from p12 (''refers to a new onset'') and the p6 legend (''newly altered mental status''), so ''new'' is added here. The other reading is the figure''s bare wording (any confusion/lethargy/disorientation).'
- id: B-006
  page: 6
  also_on:
  - 5
  - 11
  - 29
  span: High-risk situation? or Confused/lethargic/disoriented? or Severe pain/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: reported_directly
  when:
    fact: has_severe_pain
    is: true
  interpretation: verbatim
  note: 'Figure 2-2 box at decision point B; the three questions are joined by ''or'' and the Yes arrow goes to 2, so each is sufficient alone in the figure. No verb: strength comes from the figure''s arrow. Also Figure 2-1 (p5, ''High risk-confused/distress?''), Figure 4-1 (p11), Appendix B (p29). DIFFERENT STRENGTH on p12: ''All patients who have a pain rating of 7/10 or greater should be considered for meeting ESI level-2 criteria'' and ''not all patients with a pain score greater than 7 should be triaged as ESI level 2''. The figure assigns; the text only considers. The legend adds that severity needs clinical corroboration.'
- id: B-007
  page: 6
  also_on:
  - 5
  - 11
  - 29
  span: High-risk situation? or Confused/lethargic/disoriented? or Severe pain/distress?
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: reported_as_everyday_signs
  when:
    fact: has_severe_distress
    is: true
  interpretation: verbatim
  note: 'Figure 2-2 box at decision point B; the three questions are joined by ''or'' and the Yes arrow goes to 2, so each is sufficient alone in the figure. No verb: strength comes from the figure''s arrow. Also Figure 2-1 (p5, ''High risk-confused/distress?''), Figure 4-1 (p11), Appendix B (p29). DIFFERENT STRENGTH on p12: ''In consideration of assigning an ESI level 2, the nurse must assess for severe distress''. Everyday signs: the p12 list (outbursts, combativeness, distraught, acute grief).'
- id: C-006
  page: 6
  also_on:
  - 19
  - 30
  span: Count the number of different types of resources, not the individual tests or radiographs
  verb: Count the number of different types of resources
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'p19 says the same in running text: ''should count the number of different types of resources needed to determine the patient’s disposition, not the number of individual tests''.'
- id: C-007
  page: 6
  also_on:
  - 30
  span: complete blood count, electrolytes, and coagulant studies equal one resource because they are all laboratory tests
  verb: equal one resource
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: Worked counting example in the legend.
- id: C-008
  page: 6
  also_on:
  - 30
  span: complete blood count plus chest radiograph equals two resources because one is a laboratory test and one is imaging
  verb: equals two resources
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: Here a chest radiograph is called 'imaging'. p19 counts a radiograph and a CT scan as two different resources, so 'imaging' is not one type.
- id: C-009
  page: 6
  also_on:
  - 20
  - 30
  span: Labs (blood, urine)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. All lab tests together are one resource (p19).'
- id: C-010
  page: 6
  also_on:
  - 20
  - 30
  span: Electrocardiogram, radiographs
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Printed as one bullet. The text never says whether an ECG plus a radiograph is one resource or two; p19 says two radiographs are one resource and treats ''radiograph'' as its own type.'
- id: C-011
  page: 6
  also_on:
  - 20
  - 30
  span: Computed tomography, magnetic resonance imaging, ultrasound, angiography
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Printed as one bullet. Whether CT plus ultrasound is one resource or two is not stated; p19 counts radiograph and CT as two.'
- id: C-012
  page: 6
  also_on:
  - 20
  - 30
  span: Intravenous fluids (hydration)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Contrast with ''Saline or heparin lock'' in the not-a-resource column.'
- id: C-013
  page: 6
  also_on:
  - 20
  - 30
  span: Intravenous, intramuscular, or nebulized medications
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Contrast with ''Oral medications'' in the not-a-resource column. Example Four (p25) lists ''intravenous fluids'' and ''perhaps intravenous medication for nausea'' as separate items.'
- id: C-014
  page: 6
  also_on:
  - 20
  - 30
  span: Specialty consultation
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading.'
- id: C-015
  page: 6
  also_on:
  - 20
  - 30
  span: Simple procedure = 1 (laceration repair, urinary catheter)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Counts as ONE resource. Examples: laceration repair, urinary catheter.'
- id: C-016
  page: 6
  also_on:
  - 20
  - 30
  span: Complex procedure = 2 (procedural sedation)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). No verb: strength comes from the column heading. Counts as TWO resources by itself (so alone it gives level 3). Example: procedural sedation.'
- id: C-017
  page: 6
  also_on:
  - 20
  - 30
  span: History and physicaI exam (Including pelvic)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading. Span keeps the handbook''s typo on p6 (capital I for l).'
- id: C-018
  page: 6
  also_on:
  - 20
  - 30
  span: Point-of-care testing
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading. Contrast with ''Labs (blood, urine)''. The p20 dysuria example nevertheless counts urine, urine culture and ''maybe urine pregnancy'' as one lab resource.'
- id: C-019
  page: 6
  also_on:
  - 20
  - 30
  span: Saline or heparin lock
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading.'
- id: C-020
  page: 6
  also_on:
  - 20
  - 30
  span: Oral medications
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading.'
- id: C-021
  page: 6
  also_on:
  - 20
  - 30
  span: Tetanus immunization
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading. An intramuscular injection that is explicitly NOT a resource, although ''intramuscular medications'' are.'
- id: C-022
  page: 6
  also_on:
  - 20
  - 30
  span: Prescription refills
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading.'
- id: C-023
  page: 6
  also_on:
  - 20
  - 30
  span: Phone call to primary care physician
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading. Contrast with ''Specialty consultation''.'
- id: C-024
  page: 6
  also_on:
  - 20
  - 30
  span: Simple wound care (dressings, recheck)
  decision_point: C
  kind: definition
  effect: resource_band
  interpretation: verbatim
  note: 'Item in the ''Not ESI Resources'' column (Figure 2-2 legend; Table 5-1 on p20; Appendix B on p30). Counts as zero. No verb: strength comes from the column heading. Contrast with ''Simple procedure = 1 (laceration repair ...)''.'
- id: C-025
  page: 6
  also_on:
  - 20
  - 30
  span: Crutches, splints, slings
  decision_point: C
  kind: definition
