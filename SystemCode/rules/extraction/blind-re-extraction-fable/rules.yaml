    - fact: has_epistaxis
      is: true
    - fact: epistaxis_bleeding_is_brisk
      is: true
    - fact: epistaxis_is_posterior
      is: true
  interpretation: interpreted
  note: 'Preceded by ''Several etiologies of epistaxis represent high-risk situations'' and followed by ''In these situations, patients are assigned an ESI level of 2''. ''Examples include'' makes the list open. Read as: brisk nosebleed AND one of the listed circumstances. ''brisk bleeding'' is read as governing both halves (''secondary to posterior nosebleed or when experienced by ...''); the other reading is any nosebleed in a patient with the listed bleeding risks. The final ''and'' between the three patient conditions is read as ''or'' (each alone), since requiring all three together is implausible. Posterior source needs examination.'
