  interpretation: interpreted
  note: 'DIFFERENT STRENGTH on p24: ''Temperature greater than 38°C (100.4°F) in an infant younger than 90 days old is a red flag and the patient should be considered high risk and assigned at least ESI level 2'' (an assignment for the same age range that this box only asks the nurse to consider). Age band read as older than 28 days up to and including 3 months; the box''s ''1-3 months'' overlaps ''3 months and older'' at exactly 3 months.'
- id: D-020
  page: 6
  also_on:
  - 30
  span: '3 months and older: Consider assigning ESI 2 or 3 if: 1. T > 39°C (102.2°F) or < 36°C (96.8°F)'
  verb: Consider assigning ESI 2 or 3
  decision_point: D
  kind: rule
  effect: consider_level_2
  who_can_supply: vitals
  when:
    all:
    - fact: age_months
      gte: 3
    - fact: is_pediatric_patient
      is: true
    - fact: temperature_celsius
      gt: 39
  interpretation: verbatim
  note: 'Box ''Pediatric Fever Considerations'', third row: ''3 months and older: Consider assigning ESI 2 or 3 if:'' followed by three numbered items joined by ''or''/''OR'' (p6: ''1 ..., or 2 ..., OR 3''; p30: ''1 ..., OR 2 ..., or 3''), so each item is sufficient alone. The effect is ''consider ESI 2 or 3'', recorded as consider_level_2 because there is no closer effect value. No upper age for ''pediatric'' is stated. Item 1, first half. Table 6-2 on p24 gives a different red-flag threshold for ''> 3 months old'': > 38.5 °C.'
