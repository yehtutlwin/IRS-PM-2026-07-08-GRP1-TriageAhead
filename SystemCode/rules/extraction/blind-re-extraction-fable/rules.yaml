- id: B-100
  page: 14
  span: Pregnant patients who present with heavy vaginal bleeding and abnormal vitals with suspicion of infection should be categorized at ESI level 2
  verb: should be categorized at ESI level 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: observed
  when:
    all:
    - fact: is_pregnant
      is: true
    - fact: has_heavy_vaginal_bleeding
      is: true
    - fact: has_abnormal_vital_signs
      is: true
    - fact: has_suspicion_of_infection
      is: true
  interpretation: interpreted
  note: 'Read as all three together (bleeding AND abnormal vitals AND suspected infection), which is what the grammar gives. The other reading: heavy bleeding, or abnormal vitals with suspected infection. Under the chosen reading the handbook has no sentence assigning level 2 to a pregnant patient with heavy bleeding alone, although postpartum heavy bleeding alone is assigned in the next sentence. ''abnormal vitals'' has no numbers here.'
- id: B-101
  page: 14
  span: Heavy vaginal bleeding generally means soaking through a pad an hour, plum-sized clots, bright red bleeding that does not slow down, or bleeding that has increased after a decrease
  verb: generally means
  decision_point: B
  kind: definition
  effect: none
  interpretation: verbatim
  note: 'Definition of heavy vaginal bleeding by four everyday signs joined by ''or'': a pad an hour; plum-sized clots; bright red bleeding that does not slow; bleeding that has increased after a decrease.'
- id: B-102
  page: 14
  span: Postpartum patients presenting with heavy vaginal bleeding should also be assigned ESI level 2 and seen by a provider immediately
  verb: should also be assigned ESI level 2
  decision_point: B
  kind: rule
  effect: assign_level_2
  who_can_supply: reported_as_everyday_signs
  when:
