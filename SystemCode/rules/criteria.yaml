- id: D-04.context-beta-blockers-consider
  decision_point: D
  when: { field: M.beta_blocker, equals: true }
  effect_override: context_note
  assessed_via: reported
  provenance: verbatim
  source: "ESI v5 p.23 (vital signs must be contextualized)"
  span: "Medications that affect tachycardic compensation for hypotension, such as beta blockers, need to be accounted for"
