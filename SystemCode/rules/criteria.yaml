# criteria.yaml — the rulebook, knowledge base and extraction design v2 (cross-checked against a complete reading pass and extended, 4 Oct 2026, by rules/extraction/rebuild_v2.py;
# effects corrected after four blind re-extractions, 5 Oct 2026, see rules/extraction/BLIND-RE-EXTRACTIONS-ANALYSIS.md;
# the 29 Aug 2026 rulebook is kept as criteria.v1-2026-08-29.yaml, the August spike as criteria.v1-spike.yaml).
# PROCESS: extracted from sources. Each entry lists `statements`: the numbers of the sentences in
# rules/extraction/v5-complete-pass.yaml that support it, and `origin`: where the entry came from (meanings in rules/vocabulary.yaml).
# STATUS: LLM-consolidated, MECHANICALLY VERIFIED (rules/validate.py: schema + every quoted span found on its cited
# page), NOT yet human-verified. Every entry still requires a human page-check before clinical use.
# Conventions: page numbers are the handbook's PRINTED page numbers (PDF index = printed + 6). One rule per distinct
# criterion. span = contiguous text copied from the first cited page. assessed_via: reported (caregiver can answer
# by phone) | observed (clinician's eyes on the patient) | vitals (measurement). effect_override: consider = the
# handbook's own verb is softer than "assign" (flag for judgment, floor unchanged); reassess_uptriage_consider =
# decision point D's "reassess"; context_note = background the handbook gives for reading other findings (shown as a
# note, never a flag or a floor). level_from: section = the sentence names no level; the level comes from the section or list it sits in. Change log: rules/CHANGELOG.md.
# Source doc: ESI Handbook 5th Edition (ENA 2023), sources/ESI-Handbook-5th-Edition-3-2023.pdf (sources/download.sh)

# ============ DECISION POINT A — immediate lifesaving intervention required -> ESI 1 ============

- id: A-01.unresponsive
  decision_point: A
  when: { any: [
    { all: [ { field: obs.nonverbal_acute, equals: true }, { field: obs.not_following_commands, equals: true } ] },
    { field: obs.avpu, in: [P, U] } ] }
  assessed_via: observed
  provenance: verbatim
  source: "ESI v5 p.6 (Fig 2-2, definition of unresponsiveness); p.9"
  span: "Is nonverbal and not following commands (acutely)"
  notes: "Second arm of the definition (same page): 'Requires noxious stimulus (P or U on AVPU scale)'. Observed-class:
          a caregiver's 'not responding to me' cannot fire this rule (no bridge from danger_signs.responsive - the interview
          has no AVPU). The web app gives the 995 advice on danger_signs.responsive = false as product behaviour (19 Sep 2026),
          and the nurse confirms responsiveness on arrival."
  statements: [5, 6, 7, 19, 24]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

