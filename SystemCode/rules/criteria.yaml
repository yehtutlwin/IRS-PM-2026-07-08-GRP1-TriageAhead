# ============ DECISION POINT B — high-risk presentation -> ESI 2 ============

- id: B-01.new-altered-mental-status
  decision_point: B
  when: { any: [
    { field: obs.new_confusion_lethargy_disorientation, equals: true },
    { all: [ { field: obs.confusion_lethargy_disorientation, equals: true },
             { field: history.baseline_mental_status, equals: unknown } ] } ] }
  assessed_via: reported
  provenance: verbatim
  source: "ESI v5 p.12 (New Onset Confusion, Lethargy, or Disorientation)"
  span: "the nurse should assume this condition is new and assign an ESI level 2"
  notes: "Conservative default is the handbook's own: unknown baseline -> treat as new."
  statements: [51, 52]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: B-02.severe-pain-consider
  decision_point: B
  when: { field: complaint.pain_rating, gte: 7 }
  effect_override: consider
  assessed_via: reported
  provenance: verbatim
  source: "ESI v5 p.12 (Severe Pain or Distress)"
  span: "All patients who have a pain rating of 7/10 or greater should be considered for meeting ESI level-2 criteria"
  notes: "Handbook warns this is often misinterpreted: 'not all patients with a pain score greater than 7 should be
          triaged as ESI level 2'. Consider-flag only; the 7 is the handbook's number, not ours."
  statements: [8, 53, 54]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: B-03.severe-pain-systemic-cause
  decision_point: B
  when: { all: [ { field: complaint.pain_rating, gte: 7 },
                 { field: complaint.pain_cause_class, in: [renal_colic, cancer, sickle_cell_crisis] } ] }
  assessed_via: reported
  provenance: verbatim
  source: "ESI v5 p.12"
  span: "Patients experiencing severe pain or distress as a result of a systemic disruption, for example, renal colic, cancer, or sickle cell crisis, should be triaged as ESI level 2"
  notes: "The examples are the handbook's; the class list is not exhaustive (source says 'for example')."
  statements: [56]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

