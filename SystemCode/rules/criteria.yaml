  when: { all: [ { field: patient.age_months, gte: 1 }, { field: patient.age_months, lt: 3 },
                 { field: vitals.temp_c, gt: 38.0 } ] }
  effect_override: consider
  assessed_via: vitals
  provenance: verbatim
  source: "ESI v5 p.6 (Pediatric Fever Considerations)"
  span: "1-3 months: Consider assigning ESI 2 if T > 38 ° C (100.4 ° F)"
  statements: [15]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: B-59.child-over-3-months-fever-consider
  terms: [pediatric]
  decision_point: B
  when: { all: [ { field: patient.age_months, gte: 3 }, { field: patient.age, lt: 18 },
                 { any: [ { field: vitals.temp_c, gt: 39.0 }, { field: vitals.temp_c, lt: 36.0 },
                          { field: patient.immunizations_incomplete, equals: true },
                          { field: complaint.fever_no_obvious_source, equals: true } ] } ] }
  effect_override: consider
  assessed_via: reported
  provenance: verbatim
  source: "ESI v5 p.6 (Pediatric Fever Considerations)"
  span: "3 months and older: Consider assigning ESI 2 or 3 if"
  notes: "Items (same page): T > 39°C or < 36°C; incomplete immunizations; no obvious source of fever. NOTE the p.24 table
          uses > 38.5°C for > 3 months — an inconsistency inside the handbook (see B-61); expert review."
  statements: [16]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: B-60.child-hypothermia-under-36-consider
  terms: [pediatric]
  decision_point: B
  when: { all: [ { field: patient.age, lt: 18 }, { field: vitals.temp_c, lt: 36.0 } ] }
  effect_override: consider
  assessed_via: vitals
  provenance: verbatim
  level_from: section
  source: "ESI v5 p.24 (Pediatric Temperatures)"
  span: "A temperature less than 36°C (96.8°F) in a child of any age is hypothermic and concerning for sepsis"
  statements: [128]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04, blind-re-extraction-2026-10-05]

- id: B-61.child-over-3-months-temperature-red-flag-consider
  terms: [pediatric]
  decision_point: B
  when: { all: [ { field: patient.age_months, gt: 3 }, { field: patient.age, lt: 18 },
                 { any: [ { field: vitals.temp_c, gt: 38.5 }, { field: vitals.temp_c, lt: 36.0 } ] } ] }
  effect_override: consider
  assessed_via: vitals
  provenance: verbatim
  level_from: section
  source: "ESI v5 p.24 (Table 6-2 Pediatric Temperature Red Flags, row '> 3 months old')"
  span: "> 38.5 °C (101.3°F) or < 36°C (96.8°F)"
  notes: "Table 6-2 says > 38.5°C where p.6 says > 39°C for the same age band — handbook-internal discrepancy; both encoded as consider."
  statements: [129]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04, blind-re-extraction-2026-10-05]

# ============ DECISION POINT C — resource prediction -> ESI 3/4/5 (unchanged from v1 except page numbers) ============

- id: C-BAND.resource-count-to-level
  decision_point: C
  mapping: { resources_0: ESI-5, resources_1: ESI-4, resources_2_plus: ESI-3 }
  provenance: verbatim
  source: "ESI v5 p.19 (Ch.5)"
  span: "two or more resources are assigned level 3, ... one resource ... level 4, ... no resources ... level 5"
  statements: [113]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: C-COUNT.types-not-tests
  decision_point: C
  rule: "Count DIFFERENT TYPES of resources, not individual tests. All lab tests together = 1;
         all plain radiographs together = 1; lab + radiograph = 2; C-spine film + head CT = 2."
  provenance: verbatim
  source: "ESI v5 p.6 (Fig 2-2 note C); p.19 (worked examples)"
  span: "Count the number of different types of resources, not the individual tests or radiographs"
  statements: [9, 114]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: C-LIST.resources
  decision_point: C
  counts_as_resource:
    - labs_blood_or_urine
    - ecg_or_radiographs
    - ct_mri_ultrasound_angiography
    - iv_fluids_hydration
    - iv_im_or_nebulized_medications
    - specialty_consultation
    - simple_procedure
    - complex_procedure
  provenance: verbatim
  source: "ESI v5 p.6 (Fig 2-2 ESI Resources list); p.20 (Table 5-1)"
  span: "Simple procedure = 1 (laceration repair, urinary catheter)"
  statements: [10]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: C-LIST.not-resources
  decision_point: C
  does_not_count:
    - history_and_physical_exam
    - point_of_care_testing
    - saline_or_heparin_lock
    - oral_medications
    - tetanus_immunization
    - prescription_refills
    - phone_call_to_pcp
    - simple_wound_care
    - crutches_splints_slings
  provenance: verbatim
  source: "ESI v5 p.6 (Fig 2-2 Not ESI Resources list); p.20 (Table 5-1)"
  span: "Not ESI Resources"
  statements: [11]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

# ============ DECISION POINT D — high-risk vital signs -> reassess (up-triage consideration) ============

- id: D-01.adult-danger-zone
  decision_point: D
  when: { all: [ { field: patient.age, gt: 18 },
                 { any: [ { field: vitals.heart_rate, gt: 100 },
                          { field: vitals.respiratory_rate, gt: 20 },
                          { field: vitals.spo2, lt: 92 } ] } ] }
  effect_override: reassess_uptriage_consider
  assessed_via: vitals
  provenance: verbatim
  source: "ESI v5 p.23 (Fig 6-1, row '> 18 y': HR > 100, RR > 20); p.6 (Fig 2-2)"
  span: "SpO2 < 92%"
  notes: "Thresholds transcribed from the algorithm figure's table; the figure's text is not contiguous, so the span is
          the SpO2 cell. Effect is the algorithm's 'Reassess acuity decision', not an automatic 2."
  statements: [12, 13, 121, 132]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: D-02.pediatric-danger-zone-under-1-month
  decision_point: D
  when: { all: [ { field: patient.age_months, lt: 1 },
                 { any: [ { field: vitals.heart_rate, gt: 190 }, { field: vitals.respiratory_rate, gt: 60 } ] } ] }
  effect_override: reassess_uptriage_consider
  assessed_via: vitals
  provenance: verbatim
  source: "ESI v5 p.23 (Fig 6-1, row '< 1 mo': HR > 190, RR > 60); p.6"
  span: "High-risk vital signs?"
  notes: "v1 D-02 held the bands as a non-executable table; now one rule per band (D-02, D-06..D-10). SpO2 < 92% at any age is D-11."
  statements: [12, 130]
  origin: [consolidation-2026-08-29, complete-pass-2026-10-04]

- id: D-06.pediatric-danger-zone-1-to-12-months
  decision_point: D
  when: { all: [ { field: patient.age_months, gte: 1 }, { field: patient.age_months, lt: 12 },
