- id: B-30.anticoagulated-trauma
  decision_point: B
  when: { all: [ { field: E.mechanism, in: [fall, road_accident, assault] },
                 { field: M.anticoagulant.value, equals: true },
                 { field: M.anticoagulant.status, equals: confirmed } ] }
  assessed_via: reported
  provenance: supplemented
  source:
    - "CDC Field Triage Guidelines (MMWR 2012 vol. 61 no. 1), Step Four special considerations, p.14 of the report (PDF p.16) (sources/CDC-Field-Triage-2011-MMWR.pdf)"
    - "NICE NG232 (2023), recommendation 1.5.13 (PDF p.21) (sources/NICE-NG232-main-guideline.pdf)"
  span: "Anticoagulation and Bleeding Disorders: Patients with Head Injury Are at High Risk for Rapid Deterioration"
  notes: "Supplemented: not stated in ESI v5, which mentions anticoagulants only for epistaxis on p.13. CDC span above is the
          Step Four criterion heading (MMWR p.14); NICE 1.5.13 (not 1.5.9, corrected 26 Sep 2026): 'For people who have
          sustained a head injury and have no other indications for a CT head scan, but are on anticoagulant treatment ...
          consider doing a CT head scan within 8 hours'. Both sources speak of HEAD injury; our condition is any fall, road
          accident or assault on a confirmed anticoagulant, i.e. broader - flagged for expert review. Governance: guideline-grade
          sources only, dual citation; divergences attributable to this rule are claims about the external criterion, not ESI.
          Fires only on a CONFIRMED anticoagulant (status gate)."
  statements: []
  origin: [supplemented-2026-08]

