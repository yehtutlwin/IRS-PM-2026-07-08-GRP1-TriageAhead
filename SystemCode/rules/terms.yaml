# rules/terms.yaml - fuzzy terms: a word the handbook or the interview uses without a number or a list, and the number, band
# or list the system assigns to it. Knowledge base and extraction design v2. Created 13 Oct 2026 (asked for by Ye Htut Lwin).
#
# WHY A FILE. Where the handbook gives the number itself (pain 7 of 10, a fall of 6 metres, 38 degrees, 28 and 90 days, age 55
# for trauma, oxygen under 92 percent) the rule quotes it and nothing is fuzzy. Where it does not, the system still has to
# draw a line (how old is an infant; what counts as a blood thinner; how recent is recent travel), and until today those lines
# sat in five places (field glosses, triggers, bridge notes, rule notes, engine code), none reviewable as such. Each term is
# now one entry here: the phrase, the definition, the numbers or lists the programs read, the source or the reason, and
# everything that points at it. A reviewer who changes a number here changes the behaviour; the validator keeps the pointers
# and the numbers in rules and triggers in step with it.
#
# TWO KINDS OF ENTRY (14 Oct 2026). `fuzzy`: a word with a number, band or list assigned to it. `option`: one allowed value
# of a choice field (its `field` and `value`), with the definition the fact-extraction step is given for it; every value of
# every choice field in rules/fields.yaml has exactly one entry here, and the validator checks it. An entry can be both (the
# age bands are the options of patient.age_group). Options are scoped to their field: "other" means one thing for the
# complaint and another for the body region.
#
# PROCESS: operationalized where the handbook supplies the shape and we supply the line (quoted); authored where nothing in
# a document says it (reason given). `numbers` is what programs read (prototype/engine.py: the age bands and the blood-thinner
# names); `definition` is for people and for the fact-extraction glosses that repeat it. For a fuzzy term `used_by` is the list of fields,
# triggers, rules and engine derivations that carry `terms: [<id>]`; an option is used by its field and needs no pointer; rules/validate.py checks it is complete and that the
# numbers written in those rules and triggers equal the numbers here.

- id: infant
  kind: fuzzy
  field: patient.age_group
  value: infant
  term: infant
  definition: "A child under one year old."
  numbers: { age_years_min: 0, age_years_max: 1 }
  provenance: operationalized
  source: "ESI v5 p.24 (Table 6-1, Normal Vital Signs for Pediatric Patients by Age Groups); p.9 (Flaccid infant)"
  span: "Infant, 1–12 months"
  why: "The handbook's table separates 'term neonate to <1 month' from 'infant, 1-12 months'; for the flaccid-infant rule A-13 (p.9, no age given) a floppy newborn must count, so the two are taken together as under one year."
  used_by: [field:patient.age_group, engine:age_group]

- id: child
  kind: fuzzy
  field: patient.age_group
  value: child
  term: child
  definition: "One to seventeen years old: the handbook's toddler, preschooler, school-age and adolescent groups."
  numbers: { age_years_min: 1, age_years_max: 18 }
  provenance: operationalized
  source: "ESI v5 p.24 (Table 6-1)"
  span: "Adolescent, 12–18 years"
  why: "The band between infant and adult in the handbook's own table; read only through patient.age_group, which no rule reads for this value."
  used_by: [field:patient.age_group, engine:age_group]

