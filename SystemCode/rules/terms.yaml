  used_by: [rule:B-29.pediatric-subtle-ams, rule:B-53.pediatric-respiratory-distress-signs-consider, rule:B-59.child-over-3-months-fever-consider, rule:B-60.child-hypothermia-under-36-consider, rule:B-61.child-over-3-months-temperature-red-flag-consider, trigger:patient.immunizations_incomplete, trigger:complaint.fever_no_obvious_source, trigger:complaint.button_battery_or_magnet_ingestion, trigger:obs.grunting_belly_breathing_or_retractions]

- id: could_be_pregnant
  kind: fuzzy
  term: a patient who could be pregnant
  definition: "Not stated to be male, and aged ten to fifty-nine."
  numbers: { age_years_min: 10, age_years_max: 60 }
  provenance: authored
  why: "Decides who is asked about pregnancy, recent childbirth and an ectopic pregnancy (decision #76). The bounds are wide on purpose: asking one unnecessary question costs less than missing a pregnancy. No document gives them."
  used_by: [trigger:history.pregnant, trigger:history.postpartum, trigger:complaint.possible_ectopic_pregnancy]

- id: recently_gave_birth
  kind: fuzzy
  term: postpartum, recently gave birth
  definition: "Gave birth within the last six weeks."
  numbers: { weeks: 6 }
  provenance: authored
  why: "The handbook says postpartum without a limit; six weeks is the usual clinical span of the postpartum period. The field is written from what the caregiver says, so the number guides the fact-extraction gloss, not a comparison."
  used_by: [field:history.postpartum]

- id: recent_travel
  kind: fuzzy
  term: recent travel
  definition: "Travelled outside the country within the last fourteen days."
  numbers: { days: 14 }
  provenance: authored
  why: "An isolation screen needs a window; fourteen days covers the incubation of the infections the screen is for. The hospital screening form the question is quoted from asks about three weeks; a reviewer may align the two."
  used_by: [field:infection.travel_14d]

- id: recent_contact
  kind: fuzzy
  term: recent contact with an infectious illness
  definition: "Contact with someone who has an infectious illness within the last fourteen days."
  numbers: { days: 14 }
  provenance: authored
  why: "Same window as recent travel, for the same reason; the screening form asks about three weeks."
  used_by: [field:infection.contacts]

- id: recent_covid
  kind: fuzzy
  term: recent COVID-19 infection
  definition: "COVID-19 within the last few weeks; no number assigned."
  provenance: authored
