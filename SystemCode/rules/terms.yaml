  used_by: [field:history.recent_covid_infection]

- id: fever_felt
  kind: fuzzy
  term: fever (without a thermometer)
  definition: "A fever is a measured temperature of 38 degrees Celsius or more, or the patient feeling hot to the caregiver without a thermometer; a felt fever is written with lower certainty."
  numbers: { temp_c: 38 }
  provenance: operationalized
  source: "ESI v5 p.24 (fever thresholds for infants and children, 38.0°C)"
  span: "38.0"
  why: "Before arrival most caregivers have no thermometer; a felt fever must still open the fever questions. The measured value, when there is one, goes to vitals.temp_c and the handbook's thresholds apply there."
  used_by: [field:complaint.fever]

- id: eye_constellation
  kind: fuzzy
  term: a constellation of eye findings
  definition: "Two or more of the six eye findings the handbook lists."
  numbers: { min_count: 2 }
  provenance: operationalized
  source: "ESI v5 p.13 (Ocular Concerns)"
  span: "with more symptoms in constellation predicting a more emergent problem"
  why: "The handbook says more findings together mean more urgency and gives no count; two is the smallest number that is 'together'. Under clinician review (issue #66)."
  used_by: [field:complaint.atso_elements_count, rule:B-28.ocular-high-risk-constellation]

- id: blood_thinner
  kind: fuzzy
  term: a blood thinner
  definition: "An anticoagulant (warfarin and the newer oral anticoagulants, heparins) or an antiplatelet other than aspirin on its own (clopidogrel, prasugrel, ticagrelor), known by these names, or described as a medicine that thins the blood."
  numbers:
    names: [warfarin, marevan, coumadin, xarelto, rivaroxaban, eliquis, apixaban, pradaxa, dabigatran, heparin, clexane, enoxaparin, clopidogrel, plavix, prasugrel, ticagrelor, brilinta]
    phrase_pattern: "thin(s|ner)?\\s+.*blood|blood\\s*thinn"
  provenance: operationalized
  source: "ESI v5 p.13 (Ear, Nose, and Throat Concerns: 'use of warfarin or other anti-coagulants'); NICE NG232 Head injury (2023), recommendation 1.5.9 and the committee's discussion (PDF pages 21, 57 to 60), the source of the supplemented rule B-30"
  span: "warfarin or other anti-coagulants"
  why: "The handbook names warfarin and says 'other anti-coagulants'; the NICE head-injury guideline, which the blood-thinner rule B-30 rests on, includes 'antiplatelets other than aspirin monotherapy' (naming clopidogrel, prasugrel and ticagrelor) and says the risk with aspirin alone is low. The names are the medicines of those two classes in common use. A name anywhere in the medicine list confirms the fact, a description makes it probable, and B-30 needs confirmed. A reviewer may add or remove names."
  used_by: [field:M.anticoagulant, engine:anticoagulant]

- id: beta_blocker
  kind: fuzzy
  term: a beta-blocker
  definition: "A medicine whose name ends in -olol: atenolol, bisoprolol, metoprolol, propranolol, carvedilol, and others."
  numbers: { names: [atenolol, bisoprolol, metoprolol, propranolol, carvedilol, nebivolol, labetalol, sotalol] }
  provenance: authored
  why: "The handbook says beta blockers (p.23) and names none. The list guides the fact-extraction gloss; the engine does no matching for it."
  used_by: [field:M.beta_blocker]

- id: immune_weakening_medicine
  kind: fuzzy
  term: a medicine that weakens the immune system
  definition: "Long-term steroid tablets, transplant anti-rejection medicines, chemotherapy, biologic injections for arthritis or bowel disease."
  numbers: { names: [prednisolone, prednisone, dexamethasone, tacrolimus, ciclosporin, mycophenolate, azathioprine, methotrexate, adalimumab, infliximab, etanercept, rituximab] }
  provenance: operationalized
  source: "ESI v5 p.23 (vital signs must be contextualized)"
  span: "Medications that blunt a robust immune response, such as corticosteroids, must also be noted"
  why: "The handbook names corticosteroids and says 'such as'; the rest of the list is ours."
  used_by: [field:M.immunosuppressant_or_steroid]

- id: weakened_immune_system
  kind: fuzzy
  term: immunocompromised
  definition: "Defences against infection weakened by an illness or a treatment: chemotherapy or other cancer treatment, an organ transplant, HIV, long-term steroids, no spleen, or a doctor has said so."
  provenance: operationalized
  source: "ESI v5 p.12 (high-risk situations)"
  span: "A patient on chemotherapy, and therefore immunocompromised, with a fever"
  why: "The handbook names chemotherapy as one cause; the others are the usual clinical list, added so a caregiver's words ('she had a transplant') reach the rule."
  used_by: [field:history.immunocompromised]

