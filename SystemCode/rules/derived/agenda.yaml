# rules/derived/agenda.yaml - DERIVED DETERMINISTICALLY by rules/derive.py. DO NOT EDIT: regenerate.
# What the interview may ask, in order. One entry per field a caregiver can answer (a rule tagged reported reads it,
# it feeds such a rule through a bridge, or the field file gives it a purpose). Replaces the control part of the v1
# question file and the v1 agenda-rules file. The program (prototype/engine.py, open_fields) reads this at run time.
# priority: 0 danger screen (danger_signs) · 1 gate, three or more other fields wait on it · 2 feeds a rule that assigns a
#   level · 3 feeds only consider flags or context notes · 4 history and identity, no rule reads it.
# position: the order within and across priorities (more wanting rules first, then field-file order).
# ask_policy: always = asked of every patient · when_applicable = asked when its trigger holds (authored, in rules/triggers.yaml
#   file) or, with rule_gates only, when one of those rules is still possible and another of its facts is already known ·
#   volunteered_only = never asked unprompted; the extraction step may still write it. policy_default: true means the
#   field file set no policy and the default applied.
# confirm_for: a rule needs this fact confirmed; a confirmation question is due while its status is probable.
