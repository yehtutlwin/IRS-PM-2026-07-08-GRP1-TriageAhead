# ESI v4 handbook, Appendix A post-test questions (AHRQ 2012, printed pp. A-1 to A-10; PDF pp. 98-107),
# encoded as engine unit tests in the same format as tests/v4_cases.yaml. Added 29 Sep 2026.
#
# The appendix has 46 questions. Encoded here: 37. Not encoded (not patient cases):
#   Chapter 4 items 1, 2, 3, 5, 6, 11 (true/false definitions of a resource) and the three
#   chapter 7 implementation questions.
# Chapter 4 items 4, 7, 8, 9, 10 ask "how many resources?" but carry a level in the answer, so
# they are encoded against that level.
#
# STATUS: LLM-DRAFTED fact translations, UNVERIFIED by a non-encoder. Same expect classes as
# tests/v4_cases.yaml (esi1 / floor2 / none; decision points A+B only, C and D pending).
# Extra keys used here:
#   set: appA, chapter, case  -> question number within that chapter's post-test
#   skip: <reason>            -> not run: the book's level is decided at C or D
#   xfail: <reason>           -> run, expected to FAIL against the current rulebook: either the v4 answer
#                                rests on content the fifth edition dropped (v4-only), or it exposes a
#                                gap or threshold choice in our encoding. Strict: if the engine starts
#                                passing, the entry must be updated (that is a rule change to record).
#   set2: true                -> touches a rule tagged CHANGED in rules/v4-v5-diff-log.md; the expectation
#                                is re-derived under v5 and the reasoning is in `note`.
# Fifth-edition checks done by text search of sources/ESI-Handbook-5th-Edition-3-2023.pdf on 29 Sep 2026:
#   "burn" 0 occurrences; "loss of consciousness" 0; "head injury"/"head trauma" 0; trauma mechanisms are
#   the numeric list on p.21 (falls >= 6 m, ejection, mechanical extrication, sexual assault).

# ================= Chapter 2 post-test (p. A-1): assign a level =================

- set: appA
  chapter: 2
  case: 1
  v4_answer: 1
  book_span: "A 62-year-old with CPR in progress."
  synopsis: "62yo, CPR in progress"
  expect: esi1
  expect_rules: [A-02.arrest-or-imminent]
  facts:
    - {field: patient.age, value: 62}
    - {field: obs.cardiac_or_pulmonary_arrest, value: true, status: observed}
    - {field: complaint.text, value: "CPR in progress", from: second-reading}

