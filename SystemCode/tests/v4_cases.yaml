# ESI v4 practice cases (chapter 9, 100 cases) and competency cases (chapter 10, sets A and B, 25 each), AHRQ 2012,
# written as engine test cases. All 150 are here since 10 Oct 2026 (issue #67). The 83 written in August are Set 1
# (criteria unchanged between editions) and carry only the facts a rule reads; the 67 added on 10 Oct are complete
# transcriptions (see the block header further down) and include the Set 2 cases, each saying how the fifth
# edition changes the answer, if it does. The August 83 were completed to the same standard on 10 Oct 2026 (#67).
# Two extra keys on a fact (11 Oct 2026, after the second reading #68): `from: answer` marks a clinician judgement the book
# states in its ANSWER rather than in the case ("signs of shock", "requires a lifesaving intervention"), so number 1 can be
# reported with and without them; `from: second-reading` marks a fact the second reader found that the first had skipped
# (onset, free text, sex from a pronoun), kept after a glance at the printed case.
#
# STATUS: LLM-DRAFTED fact translations, UNVERIFIED. Per the diff-log protocol the fact
# translation should be reviewed by a NON-ENCODER against the v4 vignette text (printed
# pp.71-78) before the results are quoted anywhere. v4 official answers from pp.78-84.
#
# expect classes (engine = prototype/engine.py evaluate_tree; decision points A+B only —
# C (resources) and D (vitals) are pending in the engine, so:
#   esi1   -> esi1_indicators must include expect_rules (v4 answer 1)
#   floor2 -> floor == "at least ESI-2" and fired must include expect_rules (v4 answer 2)
#   none   -> floor None AND esi1 empty (v4 answer 2-5; consider-flags allowed and
#             asserted via expect_consider). For v4 answers 3/4/5 this is the meaningful
#             assertion: no A/B rule may fire (negative coverage / no false floor).
#
# Facts use the criteria.yaml field vocabulary. status defaults to "reported";
# engine.derive() runs once after the writes (mirrors runtime: meds -> M.anticoagulant).

